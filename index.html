function runQuiz(el,st){
  const lv=L();const gens=shuffle(st.quiz[lv]);let qs=[],seen=new Set();
  for(const g of gens.concat(gens)){if(qs.length>=5)break;const q=g();if(seen.has(q.q))continue;seen.add(q.q);qs.push(q)}
  let i=0,score=0,res=[];
  const show=()=>{if(i>=qs.length)return end();const q=qs[i];
    el.innerHTML=`<div class="quiz"><div class="qhead"><span class="eyebrow">Otázka ${i+1} z ${qs.length}</span><div class="qdots">${qs.map((_,k)=>`<i class="${k<i?(res[k]?'ok':'no'):k===i?'cur':''}"></i>`).join('')}</div></div>
    <div class="qtext">${q.q}</div><div class="opts">${q.opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div><div id="qx"></div></div>`;
    $$('.opt',el).forEach(b=>b.onclick=()=>{const ok=b.textContent===q.correct;res[i]=ok;if(ok)score++;AU.init();AU.sfx(ok?'chime':'thud');$$('.opt',el).forEach(x=>{x.disabled=true;if(x.textContent===q.correct)x.classList.add('ok')});if(!ok)b.classList.add('no');
      $('#qx',el).innerHTML=`<div class="explain"><b>${ok?pick(['Správne.','Presne tak.','Áno!']):pick(['Nie celkom.','Tentoraz nie.'])}</b> ${q.ex}</div><button class="btn" style="margin-top:10px" id="qn">${i<qs.length-1?'Ďalšia otázka':'Výsledok misie'}</button>`;$('#qn',el).onclick=()=>{i++;show()};$('#qn',el).focus()})};
  const end=()=>{const p=P();const prev=p.b[st.id]||0;if(score>prev)p.b[st.id]=score;if(!p.d.includes(st.id))p.d.push(st.id);save();renderHub();
    const ix=ST.indexOf(st),nx=ST[ix+1],rw=REWARD[st.id][lv],xpq=s=>s*10+(s>=4?20:0),gain=Math.max(0,xpq(score)-xpq(prev)),gold=score>=4||prev>=4;
    AU.sfx(score>=4?'success':'chime');
    const conf=score>=4?Array.from({length:26},(_,k)=>`<i style="left:${(k*37)%100}%;background:${['#E8742E','#2BA3A3','#F2B33D','#4fd2ff','#D9483B'][k%5]};animation-delay:${(k%7)*.12}s;animation-duration:${1.6+(k%5)*.3}s"></i>`).join(''):'';
    el.innerHTML=`<div class="mdone"><div class="confetti">${conf}</div><div class="eyebrow">Misia ${ix+1} splnená</div><div class="big">${score}/5</div>
     <div class="reward${gold?' gold':''}"><div class="rw-ic">${gold?'★':'☆'}</div><div><b>${rw[0]}</b><small>${gold?'Uložené v denníku':'Za 4 a viac správnych odpovedí ju získaš do denníka'}</small></div></div>
     ${gain?`<div class="xpb big2">+${gain} XP · ${rank().name}</div>`:''}
     ${nx?`<div class="teaser"><div class="gp">${portraitSVG(firstSpeaker(nx.id))}</div><div><span class="eyebrow">Ďalej: Misia ${ix+2} · ${nx.title}</span><p>${rw[1]}</p></div></div>`:`<div class="teaser"><div class="gp">${portraitSVG('hana')}</div><div><span class="eyebrow">Koniec výpravy</span><p>${rw[1]}</p></div></div>`}
     <div class="row" style="justify-content:center"><button class="btn min" id="qnext">${nx?`Misia ${ix+2}: ${nx.title} →`:'Na mapu'}</button><button class="btn ghost" id="qa">Nové otázky</button></div></div>`;
    $('#qa',el).onclick=()=>runQuiz(el,st);$('#qnext',el).onclick=()=>nx?openStation(ix+1):closeSheet()};
  show();
}

let cur=0,tab='intro',cine=null;
function killCine(){if(cine){cine.destroy();cine=null}}
function lockMsg(i){const p=P();let t=ST.findIndex((s,k)=>isOpen(k)&&!p.d.includes(s.id));if(t<0)t=0;$('#ov-card').innerHTML=`<div class="row" style="gap:14px;align-items:flex-start"><div class="gp big">${portraitSVG(firstSpeaker(ST[t].id))}</div><div style="flex:1;min-width:0"><div class="eyebrow">Misia ${i+1} je zamknutá</div><h2 style="font-size:24px;margin:.2em 0">${ST[i].title}</h2><p style="margin:.3em 0 0">Misie sa odomykajú postupne – každú odomkne kvíz tej predchádzajúcej. Teraz ťa čaká <b>Misia ${t+1}: ${ST[t].title}</b>.</p></div></div>
  <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" id="lkT">Odomknúť všetko (učiteľ)</button><button class="btn" id="lkG">Na misiu ${t+1}</button></div>`;
  $('#ov').hidden=false;$('#lkG').onclick=()=>{$('#ov').hidden=true;openStation(t)};$('#lkT').onclick=()=>{S.all=1;save();$('#ov').hidden=true;renderHub();openStation(i)}}
function openStation(i,t='intro'){if(!isOpen(i))return lockMsg(i);cur=i;const st=ST[i];const p=P();if(!p.v.includes(st.id)){p.v.push(st.id);save()}
  $('#sheet').hidden=false;document.body.style.overflow='hidden';
  $('#sh-eb').textContent=`Misia ${i+1} z ${ST.length}`;$('#sh-title').textContent=st.title;
  $('#sh-prev').disabled=i===0;$('#sh-next').textContent=i===ST.length-1?'Na mapu':'Ďalšia →';
  showTab(t);renderHub()}
function guideBox(st,lv){const g=GUIDE[st.id][lv];return `<div class="guide-b"><div class="gp">${portraitSVG(g[0])}</div><div><b>${chName(g[0],lv)}</b><p>${g[1]}</p></div></div>`}
function showTab(t){killCine();tab=t;const st=ST[cur],lv=L(),b=$('#sh-body');$$('#tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===t));
  if(t==='intro'){b.innerHTML=`<div id="cinehost"></div><div class="goal"><b>Čo sa naučíš:</b> ${st.goal[lv]}</div>`;cine=Cinema($('#cinehost'),st,lv,{onLearn:()=>showTab('learn')})}
  if(t==='learn'){b.innerHTML=`<div class="cards">${st.learn[lv].map((c,k)=>`<div class="card${c.w?' wide':''}"><h3><span class="term">${c.h}</span><button class="speak" data-k="${k}" aria-label="Prečítať nahlas">${SPK}</button></h3><p>${c.p}</p>${c.f?`<div class="fact">${c.f}</div>`:''}</div>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn" id="go">Zahraj si →</button></div>`;
    $$('.speak',b).forEach(x=>x.onclick=()=>{const c=st.learn[lv][x.dataset.k];speak(c.h+'. '+c.p+(c.f?' '+c.f:''))});$('#go').onclick=()=>showTab('game')}
  if(t==='game'){b.innerHTML=guideBox(st,lv)+'<div class="game" id="gm"></div><div class="row" style="margin-top:14px"><button class="btn" id="go">Záverečný kvíz misie →</button></div>';G[st.id]($('#gm'),lv);$('#go').onclick=()=>showTab('quiz')}
  if(t==='quiz'){b.innerHTML='<div id="qz"></div>';runQuiz($('#qz'),st)}
  $('#sheet').scrollTop=0;try{speechSynthesis.cancel()}catch(e){}}
function closeSheet(){killCine();$('#sheet').hidden=true;document.body.style.overflow='';try{speechSynthesis.cancel()}catch(e){}renderHub()}
$$('#tabs button').forEach(x=>x.onclick=()=>showTab(x.dataset.t));
$('#sh-back').onclick=closeSheet;
$('#sh-prev').onclick=()=>{if(cur>0)openStation(cur-1)};
$('#sh-next').onclick=()=>{if(cur<ST.length-1)openStation(cur+1);else closeSheet()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#ov').hidden)$('#ov').hidden=true;else if(!$('#sheet').hidden)closeSheet()}});

// ===== hub =====
function renderHub(){const lv=L(),p=P();
  $('#lv-zs').setAttribute('aria-pressed',lv==='zs');$('#lv-ss').setAttribute('aria-pressed',lv==='ss');
  $('#hero-eb').textContent=lv==='zs'?'Výprava · ZŠ · 9 misií':'Expedícia HYDRA · SŠ · 9 misií';
  $('#hero-h').innerHTML=lv==='zs'?'Od prameňa až po <em>oceán</em>':'Záhada v hĺbke <em>1 000 metrov</em>';
  $('#hero-p').textContent=lv==='zs'?'Nela a Kubo idú s tetou Hanou, hydrologičkou, na letnú výpravu. Budú sledovať jedinú kvapku vody – z oceánu do oblakov, cez jaskyne, gejzír a divokú rieku až späť do hlbín oceánu. Každá misia má film, učivo, hru a kvíz.':'Výskumná loď Dunaj, batyskaf HYDRA-1 a záhadná teplá a slaná šošovka uprostred Atlantiku. Odkiaľ sa tam vzala? Stopy vedú cez celú hydrosféru – a až na Slovensko. Každá misia odomkne ďalšiu stopu.';
  $('#hero-guide').innerHTML=CAST[lv].map(k=>`<div class="cast"><div class="gp">${portraitSVG(k)}</div><div><b>${chName(k,lv)}</b><small>${lv==='zs'&&k==='hana'?'hydrologička':CH[k].role}</small></div></div>`).join('');
  const sc=$('#land').scrollLeft;$('#land').innerHTML=hubSVG();$('#land').scrollLeft=sc;
  $$('#land .mk').forEach(m=>{const f=()=>openStation(+m.dataset.i);m.onclick=f;m.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}});
  $('#stations').innerHTML=ST.map((s,i)=>{const open=isOpen(i),done=p.d.includes(s.id),b=p.b[s.id]||0;return `<button class="st${done?' visited':''}${open?'':' locked'}" data-i="${i}"><span class="n">${open?i+1:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'}</span><span><small class="eyebrow">Misia ${i+1}</small><h3>${s.title}</h3><p>${s.short}</p></span><span class="badge${b>=4?' gold':''}">${b>=4?'★ '+b+'/5':done?b+'/5':open?'nová':'zamknutá'}</span></button>`}).join('');
  $$('#stations .st').forEach(b=>b.onclick=()=>openStation(+b.dataset.i));
  $('#meter').innerHTML=ST.map(s=>`<i class="${(p.b[s.id]||0)>=4?'gold':p.d.includes(s.id)?'on':''}"></i>`).join('');
  const r=rank();$('#rankc').innerHTML=`<span class="rk-n">${r.name}</span><span class="rk-x">${r.x} XP</span><span class="rk-bar"><i style="width:${Math.round(r.pct*100)}%"></i></span>`}
function setLevel(l){S.level=l;save();renderHub();if(!$('#sheet').hidden)openStation(cur,tab==='quiz'?'quiz':tab)}
$('#lv-zs').onclick=()=>setLevel('zs');$('#lv-ss').onclick=()=>setLevel('ss');

// diary
function diary(){const lv=L(),p=P();const r=rank();
  $('#ov-card').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="font-size:26px">${lv==='zs'?'Denník výpravy':'Denník expedície'}</h2><button class="iconbtn" id="glx">Zavrieť</button></div>
  <div class="rankbox"><div><span class="eyebrow">Hodnosť</span><b>${r.name}</b></div><div class="rk-bar big"><i style="width:${Math.round(r.pct*100)}%"></i></div><small>${r.x} XP${r.next?` · ďalšia hodnosť „${r.next[1]}“ pri ${r.next[0]} XP`:' · najvyššia hodnosť'}</small></div>
  <h3 class="dh">${lv==='zs'?'Nálepky':'Dôkazy k záhade'}</h3><div class="rwgrid">${ST.map((s,i)=>{const g=(p.b[s.id]||0)>=4;return `<div class="rwc${g?' gold':''}"><span class="rw-ic">${g?'★':'☆'}</span><div><small>Misia ${i+1}</small><b>${g?REWARD[s.id][lv][0]:'Zatiaľ nezískané'}</b></div></div>`}).join('')}</div>
  <h3 class="dh">Slovník pojmov</h3><div class="gl">${ST.map((s,i)=>{const v=p.v.includes(s.id);return `<h3>${i+1}. ${s.title}</h3><dl class="${v?'':'lock'}">${s.learn[lv].map(c=>`<dt>${c.h}</dt><dd>${v?strip(c.p):'Pojem sa odomkne po otvorení misie '+(i+1)+'.'}</dd>`).join('')}</dl>`}).join('')}</div>
  <div class="teach"><label><input type="checkbox" id="allck" ${S.all?'checked':''}> Režim učiteľa: všetky misie odomknuté</label></div>`;
  $('#ov').hidden=false;$('#glx').onclick=()=>$('#ov').hidden=true;$('#allck').onchange=e=>{S.all=e.target.checked?1:0;save();renderHub()}}
$('#btn-gl').onclick=diary;$('#rankc').onclick=diary;
$('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').hidden=true};

// init
renderHub();
if(!S.level){$('#ov-card').innerHTML=`<div class="eyebrow">Vodstvo · geografia</div><h2 style="font-size:30px;margin-top:6px">Cesta kvapky</h2><p>Vyber si výpravu. Úroveň môžeš kedykoľvek zmeniť hore v lište.</p>
  <div class="choose"><button data-l="zs"><span class="duo">${CAST.zs.map(k=>`<span class="gp">${portraitSVG(k)}</span>`).join('')}</span><span><b>Výprava s tetou Hanou</b><span>Základná škola · Nela a Kubo sledujú kvapku vody od oceánu cez hory až späť do hlbín</span></span></button>
  <button data-l="ss"><span class="duo">${CAST.ss.map(k=>`<span class="gp">${portraitSVG(k)}</span>`).join('')}</span><span><b>Expedícia HYDRA</b><span>Stredná škola · loď, batyskaf a záhada teplej šošovky v Atlantiku</span></span></button></div>`;
  $('#ov').hidden=false;$$('.choose button').forEach(b=>b.onclick=()=>{setLevel(b.dataset.l);$('#ov').hidden=true})}
requestAnimationFrame(()=>{const land=$('#land');const p=P();let c=ST.findIndex((s,i)=>isOpen(i)&&!p.d.includes(s.id));if(c<0)c=0;const svg=land.querySelector('svg');if(svg){const k=svg.getBoundingClientRect().width/1600;land.scrollLeft=Math.max(0,HM[c][0]*k-land.clientWidth/2)}});
</script>
