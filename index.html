<title>Cesta kvapky</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one horizontally scrollable landscape cross-section (source -> sea) as the hub, station cards below, each station opens a full-screen sheet with four tabs. */
:root{
  --bg:#E8EFED; --surface:#F7FAF9; --surface2:#D9E6E2; --ink:#0D2731; --muted:#4A6570; --line:#B7CAC5;
  --water:#1B6C8A; --water2:#5BA8C2; --deep:#163E5C; --foam:#D6EEF4;
  --mineral:#A8462A; --sand:#CDB78A; --moss:#5A8746; --moss2:#86AE6A; --rock:#8B8377; --clay:#9A6A4C; --snow:#FFFFFF;
  --sky1:#C9E3EC; --cloud:#FFFFFF; --sky2:#EDF5F2; --sun:#F2B33D;
  --ok:#2C7A4D; --bad:#B03838; --okbg:#DCEFE3; --badbg:#F6E0DE;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#071A20; --surface:#0E252D; --surface2:#15343E; --ink:#DCEBEE; --muted:#93AFB7; --line:#27495276;
  --water:#4AA8C6; --water2:#2C7894; --deep:#0F4562; --foam:#1E5468;
  --mineral:#E27C52; --sand:#8C7A55; --moss:#3F6A33; --moss2:#55804A; --rock:#5D574F; --clay:#76503C; --snow:#D8E4E8;
  --sky1:#0C2C3B; --cloud:#46646F; --sky2:#0A1E27; --sun:#E8A93A;
  --ok:#62C98F; --bad:#F07575; --okbg:#123A27; --badbg:#3E1C1C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#071A20; --surface:#0E252D; --surface2:#15343E; --ink:#DCEBEE; --muted:#93AFB7; --line:#27495276;
  --water:#4AA8C6; --water2:#2C7894; --deep:#0F4562; --foam:#1E5468;
  --mineral:#E27C52; --sand:#8C7A55; --moss:#3F6A33; --moss2:#55804A; --rock:#5D574F; --clay:#76503C; --snow:#D8E4E8;
  --sky1:#0C2C3B; --cloud:#46646F; --sky2:#0A1E27; --sun:#E8A93A;
  --ok:#62C98F; --bad:#F07575; --okbg:#123A27; --badbg:#3E1C1C; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--mineral);outline-offset:2px}
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
@media (max-width:480px){.brand small{display:none}.brand h1{font-size:20px}.iconbtn span{display:none}}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.lvl{display:flex;background:var(--surface2);border-radius:999px;padding:3px}
.lvl button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.lvl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #0002}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}

/* hero */
.hero{max-width:1100px;margin:0 auto;padding-block:18px 8px}
.hero h2{font-size:clamp(28px,6vw,46px);font-weight:800;letter-spacing:-.02em}
.hero h2 em{font-style:normal;color:var(--water)}
.hero p{max-width:62ch;color:var(--muted);margin:.5em 0 0}
.guide{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:15px}
.guide .av{width:40px;height:40px;flex:none}

/* landscape */
.land{margin-top:10px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-block:1px solid var(--line);background:var(--sky2);scrollbar-width:thin}
.land svg{display:block;width:max(100%, 900px);height:auto}
.land-hint{font-size:13px;color:var(--muted);text-align:center;padding-block:6px}
.mk{cursor:pointer}
.mk circle.ring{fill:var(--surface);stroke:var(--water);stroke-width:3}
.mk text{font-family:var(--f-display);font-weight:800;font-size:18px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.done circle.ring{fill:var(--water);stroke:var(--surface)}
.mk.done text{fill:var(--surface)}
.mk:hover circle.ring,.mk:focus circle.ring{stroke:var(--mineral);stroke-width:4}
.mk .lbl{font-family:var(--f-body);font-size:15px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sky2);stroke-width:4px;text-anchor:middle}
.flow{stroke-dasharray:10 14;animation:flow 2.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.rain line{stroke:var(--water2);stroke-width:2;animation:rain 1s linear infinite}
@keyframes rain{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(22px);opacity:0}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* stations grid */
.stations{max-width:1100px;margin:0 auto;padding-block:18px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.st{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.st:hover{border-color:var(--water)}
.st .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;border:3px solid var(--water);color:var(--water)}
.st.visited .n{background:var(--water);color:var(--surface)}
.st h3{font-size:18px}
.st p{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.35}
.badge{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.gold{background:var(--mineral);color:var(--surface)}
.section-h{max-width:1100px;margin:0 auto;padding-top:10px;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.section-h h2{font-size:22px}
.meter{display:flex;gap:4px}
.meter i{width:18px;height:8px;border-radius:4px;background:var(--surface2)}
.meter i.on{background:var(--water)}
.meter i.gold{background:var(--mineral)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-head{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.sh-head-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px}
.sh-head h2{font-size:22px;font-weight:800}
.tabs{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:0 10px}
.tabs button{border:0;background:var(--surface2);padding:9px 4px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--water);color:var(--surface)}
.sh-body{max-width:960px;margin:0 auto;padding-block:16px 24px;min-height:50vh}
.sh-foot{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;padding-block:8px 28px}
.btn{border:0;background:var(--water);color:var(--surface);font-weight:700;padding:11px 18px;border-radius:12px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.min{background:var(--mineral)}
.btn:disabled{opacity:.45;cursor:default}

/* intro */
.intro-scene{background:var(--sky2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.intro-scene svg{display:block;width:100%;height:auto;max-height:300px}
.caps{display:grid;gap:10px;margin-top:14px}
.cap{display:flex;gap:10px;align-items:flex-start;opacity:0;transform:translateY(8px);animation:capIn .6s ease forwards}
.cap .who{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--surface);background:var(--water);padding:3px 7px;border-radius:6px;margin-top:3px}
@keyframes capIn{to{opacity:1;transform:none}}
.goal{margin-top:16px;padding:12px 14px;border-left:4px solid var(--mineral);background:var(--surface);border-radius:0 10px 10px 0;font-size:15px}

/* learn cards */
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{font-size:19px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card p{margin:.4em 0 0}
.card ul{margin:.4em 0 0;padding-left:1.2em}
.card .term{color:var(--water)}
.speak{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;width:34px;height:34px;display:grid;place-items:center}
.speak svg{width:18px;height:18px}
.fact{font-size:15px;background:var(--surface2);border-radius:10px;padding:8px 12px;margin-top:8px}
kbd,.k{font-family:var(--f-mono);font-size:.9em;background:var(--surface2);padding:1px 6px;border-radius:5px}

/* games */
.game{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.game>*,.panel,.card,.quiz>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel h3{font-size:19px;margin-bottom:6px}
.svgbox{overflow-x:auto;border-radius:12px;background:var(--sky2);border:1px solid var(--line)}
.svgbox svg{display:block;width:100%;height:auto}
.svgbox.map svg{min-width:560px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--water);color:var(--surface);border-color:var(--water)}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.no{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:15px}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.bad{background:var(--badbg);color:var(--bad)}
label.sl{display:grid;gap:4px;font-size:15px;font-weight:700}
label.sl span.v{font-family:var(--f-mono);font-weight:500;color:var(--water)}
input[type=range]{width:100%;accent-color:var(--water);height:28px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 64px;gap:8px;align-items:center;font-size:14px}
.bar .tr{height:20px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar .fl{height:100%;border-radius:6px;transition:width 1s ease}
.bar b{font-family:var(--f-mono);font-weight:500;text-align:right}
.label-bottle{border:2px solid var(--ink);border-radius:12px;padding:12px 14px;background:var(--surface);font-family:var(--f-mono);font-size:14px;display:grid;gap:4px;max-width:360px}
.label-bottle .nm{font-family:var(--f-display);font-size:20px;font-weight:800}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:700}
.checks input{width:20px;height:20px;accent-color:var(--water)}
.measure{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.measure input{width:20px;height:20px;margin-top:3px;accent-color:var(--water);flex:none}
.measure small{display:block;color:var(--muted);font-size:13px}
.measure .cost{margin-left:auto;font-family:var(--f-mono);font-size:13px;white-space:nowrap}

/* quiz */
.quiz{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qdots{display:flex;gap:5px}
.qdots i{width:22px;height:6px;border-radius:3px;background:var(--surface2)}
.qdots i.cur{background:var(--water2)}
.qdots i.ok{background:var(--ok)}
.qdots i.no{background:var(--bad)}
.qtext{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.25}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--water)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.explain{padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:15px}
.result{text-align:center;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:10px;justify-items:center}
.result .big{font-family:var(--f-display);font-size:48px;font-weight:800;color:var(--water)}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:#0008;display:grid;place-items:center;padding:16px}
.ov-card{background:var(--bg);color:var(--ink);border-radius:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.choose{display:grid;gap:12px;margin-top:14px}
.choose button{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.choose button:hover{border-color:var(--water)}
.choose b{font-family:var(--f-display);font-size:20px;display:block}
.choose span{font-size:14px;color:var(--muted)}
.gl{display:grid;gap:6px;margin-top:10px}
.gl h3{font-size:16px;margin-top:12px;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.gl dl{margin:0;display:grid;gap:6px}
.gl dt{font-weight:700}
.gl dd{margin:0 0 6px;font-size:15px;color:var(--muted)}
.gl .lock{opacity:.5}

@media (min-width:760px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} .cards .card.wide{grid-column:1/-1} }

/* ---- v2: cinema, characters, game layer ---- */
.mk.lock circle.ring{fill:var(--surface2);stroke:var(--muted);stroke-dasharray:4 4}
.mk.lock .lk{color:var(--muted);stroke:var(--muted)}
.mk .lbl2{font-family:var(--f-body);font-size:15px;font-weight:700;fill:#0d2731;paint-order:stroke;stroke:#f2f7f6;stroke-width:4px;text-anchor:middle}
.mk.lock .lbl2{opacity:.6}
.mk .st{font-size:11px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.land{background:#cfe3ea}
.gp{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;background:radial-gradient(circle at 50% 40%,#d9ecef,#a9c6cc);border:2px solid var(--surface)}
.gp svg{width:100%;height:100%;display:block}
.gp.big{width:64px;height:64px}
.cast{display:flex;gap:8px;align-items:center}
.cast b{display:block;font-size:15px;line-height:1.2}.cast small{color:var(--muted);font-size:12.5px}
.rankc{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 10px;display:grid;grid-template-columns:auto auto;gap:0 8px;align-items:center;text-align:left;min-width:0}
.rankc .rk-n{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.rankc .rk-x{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rk-bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:3px}
.rk-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--water),var(--mineral));border-radius:3px;transition:width .8s}
.rk-bar.big{height:10px;margin:6px 0}
@media (max-width:480px){.brand>svg{display:none}.top-in{gap:8px}.brand h1{font-size:18px}.iconbtn{padding:7px 9px}}
@media (max-width:520px){.rankc .rk-x{display:none}.rankc .rk-n{max-width:84px;font-size:12px}.lvl button{padding:6px 9px}}
.st.locked{opacity:.62}.st.locked .n{border-color:var(--muted);color:var(--muted)}
.st small.eyebrow{font-size:11px}
.guide-b{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--mineral);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.guide-b b{font-family:var(--f-display)}.guide-b p{margin:.1em 0 0;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;transform:translate(-50%,140%);display:flex;gap:10px;align-items:center;background:#0d2731;color:#fff;border-radius:16px;padding:10px 16px 10px 10px;box-shadow:0 10px 30px #0006;transition:transform .45s cubic-bezier(.3,1.4,.5,1);max-width:calc(100vw - 32px)}
.toast.in{transform:translate(-50%,0)}.toast .gp{border-color:#F2B33D}
.xpb{font-family:var(--f-mono);color:#F2B33D;font-weight:500}
.xpb.big2{font-size:18px;background:#0d2731;padding:6px 14px;border-radius:999px;justify-self:center}
.mdone{position:relative;overflow:hidden;text-align:center;padding:22px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:grid;gap:12px;justify-items:center}
.mdone .big{font-family:var(--f-display);font-size:56px;font-weight:800;color:var(--water);line-height:1}
.reward{display:flex;gap:12px;align-items:center;text-align:left;border:2px dashed var(--line);border-radius:14px;padding:10px 16px;max-width:460px}
.reward.gold{border:2px solid #F2B33D;background:color-mix(in srgb,#F2B33D 14%,var(--surface));animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.reward small{display:block;color:var(--muted);font-size:13px}
.rw-ic{font-size:30px;color:#F2B33D;line-height:1}
.teaser{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);border-radius:14px;padding:10px 14px;max-width:520px}
.teaser p{margin:.2em 0 0;font-weight:700}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
.rankbox{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:12px}.rankbox b{display:block;font-family:var(--f-display);font-size:22px}.rankbox small{color:var(--muted)}
.dh{font-size:15px;margin:18px 0 8px;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.rwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}
.rwc{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:8px 10px;opacity:.6}
.rwc.gold{opacity:1;border:1px solid #F2B33D}.rwc small{display:block;color:var(--muted);font-size:11px}.rwc b{font-size:14px}
.teach{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}.teach input{width:18px;height:18px;vertical-align:middle;accent-color:var(--water)}
.choose .duo{display:flex}.choose .duo .gp{width:40px;height:40px;margin-right:-10px}
.choose button{grid-template-columns:auto 1fr}

/* cinema */
.cine{background:#061018;border-radius:18px;overflow:hidden;color:#fff;position:relative;user-select:none;-webkit-user-select:none;box-shadow:0 12px 40px #0003}
.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0a1620;cursor:pointer;max-height:62vh;width:100%}
@media (max-width:640px){.stage{aspect-ratio:4/5;max-height:58vh}}
.worlds{position:absolute;inset:0}
.world{position:absolute;left:0;top:0;transform-origin:0 0;opacity:0;transition:opacity .9s}
.world.on{opacity:1}.world.moving{will-change:transform}
.world svg{display:block}
.fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.42))}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}.flash.go{animation:flash .55s}
@keyframes flash{0%{opacity:.9}15%{opacity:.1}30%{opacity:.75}100%{opacity:0}}
.lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .7s;z-index:3}.lb.t{top:0}.lb.b{bottom:0}.letterbox .lb{height:12%}
.tcard{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:4;gap:6px;padding:16px;background:radial-gradient(ellipse,rgba(0,0,0,.35),rgba(0,0,0,.05));animation:tin 1s ease;transition:opacity .6s}
.tcard.out{opacity:0}
@keyframes tin{from{opacity:0;letter-spacing:.2em}}
.tn{font-family:var(--f-mono);letter-spacing:.35em;font-size:13px;color:#9fe3ff}
.tt{font-family:var(--f-display);font-size:clamp(30px,6.5vw,68px);font-weight:800;letter-spacing:-.02em;text-shadow:0 4px 30px #000a;line-height:1}
.tl{font-size:14px;opacity:.9;font-family:var(--f-mono)}
.hud{position:absolute;left:12px;top:12px;z-index:3;background:rgba(5,20,30,.72);border:1px solid rgba(160,230,255,.35);border-radius:10px;padding:6px 11px;font-family:var(--f-mono);display:flex;gap:9px;align-items:baseline;backdrop-filter:blur(4px)}
.hud span{font-size:11px;color:#9fe3ff;letter-spacing:.12em}.hud b{font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.inset{position:absolute;right:12px;top:54px;width:min(48%,360px);background:rgba(240,246,245,.94);color:#0d2731;border-radius:12px;padding:8px 10px;z-index:3;box-shadow:0 8px 24px #0006;animation:pop .5s}
.inset svg{width:100%;height:auto;display:block}.ins-h{font-weight:800;font-size:13px}.ins-l{font-size:12px;font-family:var(--f-mono)}
.ctl{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:7}
.cbtn{background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;backdrop-filter:blur(4px)}
.hot{position:absolute;z-index:5;width:0;height:0;padding:0;border:0;background:none}
.hot .ring{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 5px rgba(232,116,46,.55),0 0 30px #ffb43c;animation:hpulse 1.3s ease-out infinite}
.hot .hl{position:absolute;top:38px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#E8742E;color:#fff;font-weight:800;padding:7px 14px;border-radius:999px;font-size:15px;box-shadow:0 6px 18px #0007}
.hot.nudge .hl{animation:shake .4s}
@keyframes hpulse{0%{transform:scale(.75);opacity:1}100%{transform:scale(1.45);opacity:.25}}
.startov,.endov{position:absolute;inset:0;z-index:6;display:grid;place-content:center;justify-items:center;text-align:center;gap:8px;padding:16px;background:linear-gradient(180deg,rgba(3,12,18,.15),rgba(3,12,18,.82))}
.startov h3,.endov h3{font-family:var(--f-display);font-size:clamp(26px,5.5vw,52px);margin:0;color:#fff;text-shadow:0 4px 24px #000a;line-height:1.05}
.startov p{margin:0;font-family:var(--f-mono);font-size:13px;opacity:.9}
.mtag{font-family:var(--f-mono);letter-spacing:.3em;font-size:12px;color:#9fe3ff}
.play{display:inline-flex;gap:8px;align-items:center;background:#E8742E;color:#fff;border:0;border-radius:999px;padding:14px 26px;font-size:18px;font-weight:800;box-shadow:0 8px 28px rgba(232,116,46,.55);margin-top:10px;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.startov small{opacity:.75;font-size:12px;max-width:34ch}
.endov .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.dlg{display:grid;grid-template-columns:68px minmax(0,1fr) 20px;gap:12px;align-items:start;padding:12px 14px;background:linear-gradient(#0d1f29,#081419);border-top:3px solid var(--ring,#2BA3A3);min-height:124px;cursor:pointer;transition:opacity .3s}
.dlg .pt{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#3d6170,#142a33);border:3px solid var(--ring);overflow:hidden}.dlg .pt svg{width:100%;height:100%;display:block}
.dlg .nm b{font-family:var(--f-display);font-size:18px;color:#fff}.dlg .nm span{font-size:12px;color:#93b3be;margin-left:8px;font-family:var(--f-mono)}
.dlg .tx{font-size:17px;line-height:1.48;color:#eef6f8;margin-top:3px;min-height:3em}
.dlg .nx{opacity:0;color:var(--ring);align-self:end;font-size:14px}.dlg.ready .nx{opacity:1;animation:nxb 1s ease-in-out infinite}
@keyframes nxb{50%{transform:translateY(4px)}}
.dlg.dim{opacity:.45}
@media (max-width:640px){.dlg{grid-template-columns:52px minmax(0,1fr) 16px;gap:10px;padding:10px 12px;min-height:132px}.dlg .pt{width:52px;height:52px}.dlg .tx{font-size:15.5px}.dlg .nm b{font-size:16px}}
/* figures & world states */
.wsvg .eyes{animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.talk .mouth{animation:talk .2s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.7)}}
.talk .head{animation:nod 1.3s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(3deg)}70%{transform:rotate(-2deg)}}
.arm{transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.pose-point .armR{transform:rotate(-118deg)}
.pose-up .armR{transform:rotate(-155deg)}.pose-up .armL{transform:rotate(155deg)}
.pose-paddle .armR{animation:paddle 1.3s ease-in-out infinite}
@keyframes paddle{50%{transform:rotate(-45deg)}}
.pony{animation:pony 3s ease-in-out infinite}@keyframes pony{50%{transform:rotate(6deg)}}
.bob{animation:bob 5s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(5px) rotate(.7deg)}}
.radar{animation:radar 2.6s linear infinite}@keyframes radar{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.rot,.prop{animation:rot .09s linear infinite alternate}@keyframes rot{from{transform:scaleX(1)}to{transform:scaleX(.55)}}
.rot{transform-box:fill-box;transform-origin:center}.prop{transform-box:fill-box;transform-origin:center}
.beams{opacity:0;transition:opacity 1.2s}.lights .beams{opacity:1}
.beam{mix-blend-mode:screen}
.released [data-k=cable]{opacity:0}
.lensg{opacity:0;transition:opacity 2s}.lens .lensg{opacity:1}
.swim{animation:swim 6s ease-in-out infinite}@keyframes swim{50%{transform:rotate(-2deg) translateY(10px)}}
.vapg{opacity:0;transition:opacity 2s}.evap .vapg{opacity:1}
.clg{transform:scale(.18);opacity:.1;transition:transform 5s cubic-bezier(.2,.8,.3,1),opacity 4s}.grow .clg{transform:scale(1);opacity:1}
.cls{opacity:0;transition:opacity 2.5s}.storm .cls{opacity:1}
.windg{opacity:0;transition:opacity 1.5s}.wind .windg{opacity:.85}
.bolt{opacity:0}.bolt-on .bolt{opacity:1}
.trc{stroke-dasharray:1 1;stroke-dashoffset:1}.go .trc{stroke-dashoffset:0;transition:stroke-dashoffset 10s linear}
.cavecrew{opacity:0;transition:opacity 1.2s}.incave .cavecrew{opacity:1}
.colg{transform:scaleY(0);transition:transform 1.5s cubic-bezier(.2,.9,.3,1)}.erupt .colg{transform:scaleY(1)}
.erupt .colg>path:first-child{animation:gush .35s ease-in-out infinite alternate 1.5s;transform-box:fill-box;transform-origin:bottom}
@keyframes gush{to{transform:scale(1.06,.97)}}
.erupt .calm{opacity:0}
.rbw{opacity:0;transition:opacity 3s}.rb .rbw{opacity:1}
.dp{stroke-dasharray:1 1;stroke-dashoffset:1}.goL .dpl,.goR .dpr{stroke-dashoffset:0;transition:stroke-dashoffset 4.5s ease-in}
.seaL,.seaR{opacity:0;transition:opacity 1s 3.5s}.goL .seaL,.goR .seaR{opacity:1}
.goL .dropL,.goR .dropR{opacity:0;transition:opacity .4s}
.uwl{opacity:0;transition:opacity 1s}.uw .uwl{opacity:1}
.sunny{opacity:0;transition:opacity 3s}.clear .sunny{opacity:1}
.stormc{transition:opacity 3s}.clear .stormc{opacity:0}
.flbl{opacity:0;transition:opacity 1s}.labels .flbl{opacity:1}
.bagsg{transform:scaleY(0)}.bagsup .bagsg{transform:scaleY(1);transition:transform .7s cubic-bezier(.3,1.6,.5,1)}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }

<script>
// ===== ART TOOLKIT =====
let PF='a',DEFS=[],DEFSET=new Set();
const gid=n=>PF+'-'+n, gurl=n=>`url(#${PF}-${n})`;
function srng(seed){let s=(Math.imul(seed+1,2654435761))>>>0||7;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const h2r=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
function mix(a,b,t){const x=h2r(a),y=h2r(b);return'#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
const dk=(h,t)=>mix(h,'#000000',t), lt=(h,t)=>mix(h,'#ffffff',t);
function addDef(n,s){if(DEFSET.has(n))return;DEFSET.add(n);DEFS.push(s)}
const stopsS=st=>st.map(s=>`<stop offset="${s[0]}" stop-color="${s[1]}"${s[2]!=null?` stop-opacity="${s[2]}"`:''}/>`).join('');
function LG(n,st,o={}){addDef(n,`<linearGradient id="${gid(n)}" x1="${o.x1??0}" y1="${o.y1??0}" x2="${o.x2??0}" y2="${o.y2??1}"${o.u?' gradientUnits="userSpaceOnUse"':''}>${stopsS(st)}</linearGradient>`);return gurl(n)}
function RG(n,st,o={}){addDef(n,`<radialGradient id="${gid(n)}" cx="${o.cx??.5}" cy="${o.cy??.5}" r="${o.r??.5}"${o.fx!=null?` fx="${o.fx}" fy="${o.fy}"`:''}${o.u?' gradientUnits="userSpaceOnUse"':''}>${stopsS(st)}</radialGradient>`);return gurl(n)}
function FIL(n,body){addDef(n,`<filter id="${gid(n)}" x="-60%" y="-60%" width="220%" height="220%">${body}</filter>`);return gurl(n)}
function world(key,w,h,build,extra={}){PF=key;DEFS=[];DEFSET=new Set();const inner=build();return Object.assign({key,w,h,svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" class="wsvg"><defs>${DEFS.join('')}</defs>${inner}</svg>`},extra)}
function place(k,x,y,inner,o={}){return `<g data-k="${k}" data-x="${x}" data-y="${y}" data-s="${o.s??1}" data-r="${o.r??0}" transform="translate(${x} ${y}) rotate(${o.r??0}) scale(${(o.flip?-1:1)*(o.s??1)} ${o.s??1})"${o.op!=null?` opacity="${o.op}"`:''}${o.ch?` data-ch="${o.ch}"`:''}><g class="${o.cls||''}">${inner}</g></g>`}

// ---- terrain ----
function ridgePts(seed,x0,x1,yTop,yBot,o={}){const r=srng(seed);const n=o.peaks||5;let p=[];
  for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const f=o.shape?o.shape(i/n,r):(.08+r()*.85);p.push([x,yTop+(yBot-yTop)*f])}
  let amp=(yBot-yTop)*(o.amp??.25);for(let k=0;k<(o.iter??6);k++){const q=[p[0]];for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];q.push([(a[0]+b[0])/2+(r()-.5)*(b[0]-a[0])*.25,(a[1]+b[1])/2+(r()-.5)*amp]);q.push(b)}p=q;amp*=o.rough??.5}return p}
const PD=p=>'M'+p.map(a=>a[0].toFixed(1)+' '+a[1].toFixed(1)).join('L');
function yAt(p,x){if(x<=p[0][0])return p[0][1];for(let i=0;i<p.length-1;i++)if(x<=p[i+1][0]){const t=(x-p[i][0])/((p[i+1][0]-p[i][0])||1);return p[i][1]+(p[i+1][1]-p[i][1])*t}return p[p.length-1][1]}
function range(seed,x0,x1,yTop,yBot,fill,o={}){const p=o.pts||ridgePts(seed,x0,x1,yTop,yBot,o);const base=o.base??yBot+800;const body=`${PD(p)}L${x1} ${base}L${x0} ${base}Z`;
  let s=`<path d="${body}" fill="${fill}"/>`;
  if(o.lit)s+=`<path d="${body}" fill="${LG('lit'+seed,[[0,'#ffffff',o.lit],[.45,'#ffffff',0],[.55,'#000000',0],[1,'#000000',o.lit*1.2]],{x2:1,y2:0})}"/>`;
  if(o.snow)s+=`<path d="${body}" fill="${LG('sn'+seed,[[0,'#ffffff',.97],[.6,'#eef4f8',.8],[1,'#ffffff',0]],{u:1,x1:0,y1:Math.min(...p.map(a=>a[1])),x2:0,y2:o.snow})}"/>`;
  if(o.fade)s+=`<path d="${body}" fill="${LG('fd'+seed,[[0,o.fade,0],[1,o.fade,o.fadeA??.6]],{u:1,x1:0,y1:yTop,x2:0,y2:yBot+(o.fadeD??200)})}"/>`;
  return o.ret?{s,p}:s}
function pine(x,y,h,c){const w=h*.3,c2=dk(c,.28);const P=(sgn)=>`M0 ${-h} L${sgn*w*.42} ${-h*.66} L${sgn*w*.24} ${-h*.66} L${sgn*w*.72} ${-h*.36} L${sgn*w*.44} ${-h*.36} L${sgn*w} ${-h*.1} L0 ${-h*.1}Z`;
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect x="-1.4" y="${-h*.13}" width="2.8" height="${h*.13}" fill="#4b3526"/><path d="${P(-1)}" fill="${c}"/><path d="${P(1)}" fill="${c2}"/></g>`}
function tree(x,y,h,c){const c2=dk(c,.25),c3=lt(c,.15);return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect x="-2" y="${-h*.4}" width="4" height="${h*.4}" fill="#5a4030"/><circle cx="0" cy="${-h*.62}" r="${h*.3}" fill="${c2}"/><circle cx="${-h*.17}" cy="${-h*.55}" r="${h*.22}" fill="${c}"/><circle cx="${h*.1}" cy="${-h*.78}" r="${h*.2}" fill="${c3}"/></g>`}
function forest(seed,p,x0,x1,o={}){const r=srng(seed);let a=[];for(let x=x0;x<x1;x+=(o.gap||14)*(.5+r())){const y=yAt(p,x)+(o.dy||0)+r()*(o.jit||8);a.push([x,y,(o.h?.[0]||20)+r()*((o.h?.[1]||36)-(o.h?.[0]||20))])}
  a.sort((m,n)=>m[1]-n[1]);const cs=o.c||['#2f5a3a'];return a.map(t=>(o.deci&&r()<o.deci?tree:pine)(t[0],t[1],t[2],cs[Math.floor(r()*cs.length)])).join('')}
function strata(seed,x0,x1,y0,y1,col,n=8){const r=srng(seed);let s='';for(let i=0;i<n;i++){const y=y0+(y1-y0)*(i+.5)/n;let d=`M${x0} ${y}`;for(let x=x0;x<=x1;x+=80)d+=`L${x} ${(y+(r()-.5)*14).toFixed(1)}`;s+=`<path d="${d}" stroke="${col}" stroke-width="${1+r()*2}" fill="none" opacity=".5"/>`}return s}
// ---- sky & water ----
const CLT={day:[['#ffffff'],['#f2f6fa'],['#c3cfdc']],warm:[['#fff1dc'],['#f6c9a6'],['#c98a70']],storm:[['#9aa4b0'],['#5f6874'],['#353c46']],night:[['#5c6d84'],['#3d4c62'],['#25303f']]};
function cloud(seed,x,y,s,o={}){const r=srng(seed);const t=o.tint||'day';const c=CLT[t];const g=LG('cl'+t,[[0,c[0][0]],[.55,c[1][0]],[1,c[2][0]]]);const W=o.w||220,n=o.n||9;
  let q=`<ellipse cx="0" cy="-${W*.05}" rx="${W*.52}" ry="${W*.1}" fill="${g}"/>`;
  for(let i=0;i<n;i++){const t2=i/(n-1);const e=1-Math.abs(t2-.5)*2;const rr=W*(.09+e*.12+r()*.06);const cx=(t2-.5)*W*.9+(r()-.5)*W*.06;const cy=-rr*.5-e*W*.14*(.4+r()*.6);q+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr.toFixed(1)}" fill="${g}"/>`}
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o.op??1}"${o.k?` data-k="${o.k}"`:''}${o.cls?` class="${o.cls}"`:''}>${q}</g>`}
function glitter(seed,x0,x1,y0,y1,n,col,o={}){const r=srng(seed);let s='';for(let i=0;i<n;i++){const f=Math.pow(r(),1.5);const y=y0+(y1-y0)*f;const x=o.cone?x0+(x1-x0)*(.5+(r()-.5)*(.25+f*1.2)):x0+(x1-x0)*r();const w=4+f*28*(.4+r());s+=`<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${(1+f*2.4).toFixed(1)}" rx="1" fill="${col}" opacity="0"><animate attributeName="opacity" values="0;${(.5+r()*.5).toFixed(2)};0" dur="${(1.4+r()*2.4).toFixed(2)}s" begin="${(r()*3).toFixed(2)}s" repeatCount="indefinite"/></rect>`}return s}
function waves(y,w,amp,len,col,o={}){let d=`M${-len*2} ${y}`;for(let x=-len*2;x<=w+len*2;x+=len)d+=` q${len/4} ${-amp} ${len/2} 0 t${len/2} 0`;d+=` V${y+(o.depth??500)} H${-len*2}Z`;

const num=(n,d=0)=>Number(n).toLocaleString('sk-SK',{minimumFractionDigits:d,maximumFractionDigits:d});
const mc=(q,correct,wrong,ex)=>{const w=shuffle([...new Set(wrong)].filter(x=>x!==correct)).slice(0,3);return {q,opts:shuffle([correct,...w]),correct,ex}};

const nd=(v,d,unit='')=>{const s=new Set([num(v,d)+unit]);const f=[0.5,0.7,1.3,1.6,2,0.1,10];for(const k of shuffle(f)){if(s.size>=4)break;s.add(num(v*k,d)+unit)}return [...s].slice(1)};

   ()=>{const s=pick([['Voda sa vyparí z Atlantického oceánu, vietor ju zanesie nad Slovensko, kde naprší, a Dunajom sa vráti do mora.','veľký kolobeh'],['Voda sa vyparí z oceánu a hneď nad oceánom aj naprší.','malý kolobeh'],['Voda sa vyparí z lesa a jazera a naprší nad tým istým pohorím.','malý kolobeh']]);return mc(`O aký kolobeh ide? ${s[0]}`,s[1],['veľký kolobeh','malý kolobeh'],'Veľký kolobeh spája oceán a pevninu, malý prebieha len nad oceánom alebo len nad pevninou.')},
   ()=>mc('Kam sa dostane voda, ktorá vsiakne hlboko do zeme?','stane sa z nej podzemná voda',['hneď sa vyparí','zmení sa na ľad','zmizne navždy'],'Vsiaknutá voda dopĺňa podzemnú vodu a neskôr môže vyvierať v prameňoch.')
  ],
  ss:[
   ()=>mc('Ako sa nazýva súčet výparu z povrchu a výparu cez rastliny?','evapotranspirácia',['evaporácia','advekcia','infiltrácia'],'Evaporácia + transpirácia = evapotranspirácia.'),
   ()=>{const Z=R(6,9)*100,phi=pick([0.2,0.25,0.3,0.35,0.4]);const O=Math.round(Z*phi);return mc(`Na povodie spadne ročne ${num(Z)} mm zrážok, odtečie ${num(O)} mm. Aký je koeficient odtoku?`,num(phi,2),nd(phi,2),`φ = ${num(O)} / ${num(Z)} = ${num(phi,2)}. Odtečie ${num(phi*100)} % zrážok.`)},
   ()=>{const Z=R(6,10)*100,O=R(15,35)*10;const E=Z-O;return mc(`Povodie dostane za rok ${num(Z)} mm zrážok a odtečie ${num(O)} mm. Koľko vody sa vyparí, ak sa zásoby nemenia?`,`${num(E)} mm`,[`${num(Z+O)} mm`,`${num(O)} mm`,`${num(Math.round(E/2))} mm`],`Zo vodnej bilancie: výpar = zrážky − odtok = ${num(Z)} − ${num(O)} = ${num(E)} mm.`)},
   ()=>mc('Na svahu vyrúbali les. Čo sa stane s infiltráciou a povrchovým odtokom?','infiltrácia klesne, povrchový odtok stúpne',['infiltrácia stúpne, odtok klesne','obe stúpnu','nezmení sa nič'],'Bez lesa a koreňov voda rýchlejšie steká, menej vsakuje a koeficient odtoku rastie.'),
   ()=>mc('Čo označuje pojem advekcia v obehu vody?','vodorovný prenos vzdušných más s vodnou parou',['vsakovanie vody do pôdy','výpar cez listy','tvorbu ľadovcov'],'Advekcia prenáša vodnú paru napríklad z oceánu nad pevninu – bez nej by nebol veľký obeh.'),
   ()=>{const x=pick([['sneh v horách','retencia'],['voda v jazere','retencia'],['nesústredené stekanie vody po svahu','ron'],['vsakovanie dažďa do lúky','infiltrácia']]);return mc(`Ktorý pojem zodpovedá javu: ${x[0]}?`,x[1],['retencia','ron','infiltrácia','kondenzácia'],'Retencia = dočasné zadržanie vody, ron = nesústredený povrchový odtok, infiltrácia = vsakovanie.')}
  ]}
},

{id:'podzemie',title:'Pod zemou',short:'Podzemná voda, studne, kras a jaskyne',
 intro:{
  zs:['Spadla som na lúku a vsiakla do pôdy.','Prešla som cez piesok a štrk, až kým ma nezastavila vrstva ílu, ktorá vodu neprepustí.','Tu sa zbiera podzemná voda. Ľudia ju čerpajú zo studní.'],
  ss:['Sonda klesá pod povrch. Najprv zóna prevzdušnenia, potom zóna nasýtenia.','Hranica medzi nimi je hladina podzemnej vody. Pod ňou sú všetky póry zaplnené vodou.','Úloha: nájsť kolektor, izolátor a vysvetliť, kedy vzniká artézska voda.']},
 goal:{zs:'Vysvetlíš, ako vzniká podzemná voda, prameň a studňa, a čo sú krasové javy.',ss:'Rozlíšiš druhy podpovrchovej vody, vysvetlíš vznik artézskej vody a nerovnomerné zásoby v SR.'},
 learn:{

   {h:'Hladina podzemnej vody',p:'Horná hranica vrstvy nasiaknutej vodou. Keď veľa prší, <b>stúpa</b>. V suchu <b>klesá</b>.'},
   {h:'Studňa',p:'Aby bola v studni voda, musí siahať hlbšie, ako je hladina podzemnej vody – aj v suchom lete.'},

   {h:'Kras a jaskyne',p:'Vo vápenci voda pomaly rozpúšťa horninu. Vznikajú <b>jaskyne</b>, <b>ponory</b> (potok zmizne pod zem) a <b>vyvieračky</b> (voda vyviera z podzemia).',f:'Slovenský kras a Demänovská dolina patria k najznámejším krasovým územiam Slovenska.'}
  ],
  ss:[
   {h:'Podpovrchová voda',p:'<b>Pôdna voda</b> v zóne prevzdušnenia (póry sú čiastočne vzduch) a <b>podzemná voda</b> v zóne nasýtenia. Hranicou je hladina podzemnej vody.'},
   {h:'Kolektor a izolátor',p:'<b>Kolektor</b> (zvodnená vrstva) je priepustná hornina, ktorá vodu obsahuje a vedie – štrky, piesky, rozpukané vápence. <b>Izolátor</b> je nepriepustná vrstva – íly, slieňovce.'},
   {h:'Voľná a napätá hladina',p:'Pri <b>voľnej hladine</b> je nad vodou priepustná vrstva so vzduchom. <b>Napätá hladina</b> vzniká, keď je kolektor uzavretý medzi dvoma izolátormi a voda je pod tlakom.'},
   {h:'Artézska voda',p:'Podzemná voda s napätou hladinou v sklonenej alebo miskovitej panve. Dopĺňa sa vo vyššie položenej oblasti. Po navŕtaní vystúpi vďaka tlaku, niekedy až nad povrch – <b>artézska studňa</b>. Príklad: Veľká artézska panva v Austrálii.'},
   {h:'Prameň a výdatnosť',p:'Prameň – miesto prirodzeného výveru podzemnej vody. <b>Výdatnosť</b> = množstvo vody, ktoré vytečie za jednotku času, napr. <span class="k">l/s</span>.'},
   {h:'Zásoby podzemnej vody v SR',p:'Najväčšie sú v štrkopieskových náplavoch nížin, hlavne na <b>Žitnom ostrove</b>, a v krasových územiach. Malé sú vo flyšových pohoriach severu a severovýchodu, kde prevládajú málo priepustné íly a pieskovce.'}
  ]},
 quiz:{
  zs:[
   ()=>{const h=pick([['štrk','prepúšťa'],['piesok','prepúšťa'],['íl','neprepúšťa'],['vápenec (cez pukliny)','prepúšťa']]);return mc(`Ako sa správa ${h[0]} k vode?`,`vodu ${h[1]}`,['vodu prepúšťa','vodu neprepúšťa','vodu mení na paru'],'Štrk, piesok a rozpukaný vápenec vodu prepúšťajú, íl nie.')},
   ()=>mc('Čo je prameň?','miesto, kde podzemná voda vyviera na povrch',['miesto, kde rieka vteká do mora','hlboká studňa','jazero v horách'],'Prameň je začiatok potoka alebo rieky – tam vyviera podzemná voda.'),
   ()=>mc('Čo sa stane s hladinou podzemnej vody v dlhom suchom lete?','klesne',['stúpne','nezmení sa','zamrzne'],'Bez zrážok voda nevsakuje, a preto hladina klesá a plytké studne vysychajú.'),
   ()=>{const x=pick([['potok zmizne v puklinách pod zemou','ponor'],['voda z jaskyne vyteká na povrch','vyvieračka']]);return mc(`Ako sa v krase nazýva miesto, kde ${x[0]}?`,x[1],['ponor','vyvieračka','delta','pleso'],'Ponor = voda mizne pod zem, vyvieračka = voda vyviera z podzemia.')},
   ()=>mc('Ktorá studňa bude mať vodu aj v suchom lete?','tá, ktorá siaha hlboko pod hladinu podzemnej vody',['tá, ktorá je na kopci','tá, ktorá je najširšia','tá, ktorá je plytká'],'Hladina v suchu klesá, preto musí studňa siahať dostatočne hlboko.')
  ],
  ss:[
   ()=>mc('Aké podmienky potrebuje vznik artézskej vody?','kolektor uzavretý medzi dvoma izolátormi v sklonenej panve',['jedna priepustná vrstva na povrchu','teplo zo zemského vnútra','krasové jaskyne'],'Kolektor medzi izolátormi a vyššie položená oblasť doplňovania vytvárajú tlak – napätú hladinu.'),
   ()=>{const t=R(4,20),v=R(2,12)*10;const q=v/t;return mc(`Z prameňa naplníš ${num(v)}-litrovú nádobu za ${num(t)} sekúnd. Aká je výdatnosť prameňa?`,`${num(q,1)} l/s`,nd(q,1,' l/s'),`Výdatnosť = objem / čas = ${num(v)} l / ${num(t)} s ≈ ${num(q,1)} l/s.`)},
   ()=>{const x=pick([['štrkopiesky','kolektor'],['íly','izolátor'],['rozpukané vápence','kolektor'],['slieňovce','izolátor']]);return mc(`Ako sa správajú ${x[0]} z hľadiska podzemnej vody?`,x[1],['kolektor','izolátor'],'Kolektor vodu vedie, izolátor ju neprepúšťa.')},
   ()=>mc('Prečo má severovýchod Slovenska málo podzemnej vody?','prevláda flyš s málo priepustnými ílmi a pieskovcami',['je tam veľa sopiek','je tam málo zrážok','je tam veľa jaskýň'],'Flyšové horniny vodu zle prepúšťajú, preto sa podzemná voda nemá kde hromadiť.'),
   ()=>mc('Ktoré územie SR má najväčšiu zásobu podzemnej vody?','Žitný ostrov',['Vihorlatské vrchy','Spišská Magura','Kremnické vrchy'],'Hrubé štrkopieskové náplavy Dunaja na Žitnom ostrove tvoria obrovský kolektor.'),
   ()=>mc('Čím sa líši pôdna voda od podzemnej vody?','pôdna je v zóne prevzdušnenia, podzemná v zóne nasýtenia',['pôdna je slaná, podzemná sladká','pôdna je teplá, podzemná studená','nijako, sú to synonymá'],'Nad hladinou podzemnej vody sú póry čiastočne so vzduchom (pôdna voda), pod ňou úplne zaplnené vodou.')
  ]}

{id:'pramene',title:'Minerálne pramene',short:'Kyselky, termálne pramene a gejzír',
 intro:{
  zs:['Hlboko pod zemou som sa zohriala a rozpustila v sebe minerálne látky.','Keď som vyvrela na povrch, už som nebola obyčajná voda. Stala sa zo mňa minerálka.','Slovensko patrí k územiam najbohatším na minerálne pramene v Európe.'],
  ss:['Sonda zaznamenala rast teploty: približne 3 °C na každých 100 metrov hĺbky.','Voda, ktorá prenikne hlboko po zlomoch, sa zohreje a obohatí o minerálne látky a plyny.','Úloha: klasifikovať vzorky vôd podľa mineralizácie, plynov a teploty.']},
 goal:{zs:'Rozlíšiš minerálnu, uhličitú (kyselku) a termálnu vodu a nájdeš kúpele na mape.',ss:'Klasifikuješ minerálne a termálne vody, vysvetlíš ich vznik a využitie.'},
 learn:{
  zs:[
   {h:'Minerálna voda',p:'Voda, ktorá obsahuje veľa rozpustených minerálnych látok – <b>viac ako 1 gram v jednom litri</b> – alebo plyny.'},
   {h:'Kyselka',p:'Minerálna voda s <b>oxidom uhličitým</b>. Ten v nej robí bublinky a dáva jej kyslastú chuť.'},
   {h:'Termálna voda',p:'Teplá voda z veľkej hĺbky. Na povrchu má <b>viac ako 20 °C</b>. Využíva sa v kúpeľoch a na kúpaliskách.'},
   {h:'Kúpele',p:'Liečivé pramene využívajú kúpele: Piešťany, Trenčianske Teplice, Bardejovské Kúpele, Dudince, Sliač a ďalšie.'},
   {h:'Gejzír v Herľanoch',p:'Studený gejzír pri Košiciach. Voda z vrtu vystrekuje vyše 10 metrov vysoko. Vystreľuje ju oxid uhličitý.'},
   {h:'Travertín',p:'Z vody, ktorá obsahuje veľa vápnika, sa pri prameni ukladá hornina <b>travertín</b>. Príklad: Vyšné Ružbachy, Bešeňová.'}
  ],
  ss:[
   {h:'Minerálna voda',p:'Podľa bežného delenia: obsah rozpustených tuhých látok nad <span class="k">1 000 mg/l</span>, alebo obsah CO₂ nad <span class="k">1 000 mg/l</span>, prípadne zvýšený obsah biologicky významných zložiek (jód, železo…).'},
   {h:'Delenie podľa plynov',p:'<b>Uhličité vody (kyselky)</b> – CO₂ nad 1 000 mg/l (Bardejov, Sliač). <b>Sírovodíkové (sírne)</b> – H₂S nad 1 mg/l (Piešťany, Smrdáky, Trenčianske Teplice).'},
   {h:'Delenie podľa teploty',p:'<b>Studené</b> do 20 °C a <b>termálne</b> nad 20 °C na mieste výveru.'},
   {h:'Vznik',p:'Voda preniká do hĺbky po <b>zlomoch</b> a puklinách. Ohrieva ju geotermálny gradient – asi <span class="k">3 °C na 100 m</span>. Cestou rozpúšťa horniny a obohacuje sa o plyny. Pramene sa preto viažu na zlomové línie a okraje kotlín.'},
   {h:'Využitie',p:'Kúpeľníctvo a balneoterapia, plnenie minerálnych vôd, termálne kúpaliská (Podhájska, Bešeňová, Patince), geotermálna energia na vykurovanie (napríklad Galanta).'},
   {h:'Travertín a gejzír',p:'Z vôd bohatých na hydrogenuhličitan vápenatý sa zráža travertín (Vyšné Ružbachy, Dreveník). Herľanský gejzír je studený – erupcie spôsobuje tlak CO₂, nie teplo.'}
  ]},
 quiz:{
  zs:[
   ()=>mc('Čo dáva kyselke bublinky?','oxid uhličitý',['kyslík','soľ','železo'],'Kyselky obsahujú veľa oxidu uhličitého (CO₂).'),
   ()=>{const t=pick([[24,'termálna'],[38,'termálna'],[67,'termálna'],[12,'studená'],[9,'studená']]);return mc(`Voda vyviera s teplotou ${t[0]} °C. Aká je?`,t[1],['termálna','studená'],'Termálna voda má na povrchu viac ako 20 °C.')},
   ()=>mc('Ktorá hornina sa ukladá z vody pri niektorých prameňoch?','travertín',['žula','čadič','uhlie'],'Travertín je vápnitá hornina, ktorá sa zráža z minerálnej vody.'),
   ()=>mc('Aký je gejzír v Herľanoch?','studený, poháňa ho oxid uhličitý',['horúci, poháňa ho sopka','umelá fontána s čerpadlom','podmorský'],'Herľanský gejzír je studený – vodu vytláča plyn CO₂.'),
   ()=>{const t=pick(['Piešťany','Bardejovské Kúpele','Dudince','Trenčianske Teplice','Sliač']);return mc('Ktoré z týchto miest sú známe kúpele?',t,['Kriváň','Gerlachovský štít','Domaša','Senné'],`${t} sú známe kúpele s minerálnymi prameňmi.`)},
   ()=>mc('Kedy hovoríme o minerálnej vode?','keď má viac ako 1 gram rozpustených látok v litri',['keď je studená','keď je v plastovej fľaši','keď je z vodovodu'],'Minerálna voda obsahuje veľa rozpustených minerálnych látok alebo plynov.')
  ],
  ss:[
   ()=>{const h=R(10,25)*100,t0=pick([9,10,11]);const T=t0+3*h/100;return mc(`Voda vystúpi z hĺbky ${num(h)} m. Na povrchu je priemerná teplota ${t0} °C, gradient je 3 °C/100 m. Akú teplotu mohla mať v hĺbke?`,`asi ${num(T)} °C`,nd(T,0,' °C').map(x=>'asi '+x),`T = ${t0} + 3 × ${num(h)}/100 = ${num(T)} °C.`)},
   ()=>{const M=pick([R(1300,6000),R(300,800)]),C=pick([R(1200,3000),R(10,400)]),T=pick([R(25,60),R(8,16)]);const isM=M>1000||C>1000;const parts=[];if(isM)parts.push('minerálna');else parts.push('nie je minerálna');if(C>1000)parts.push('uhličitá');if(T>20)parts.push('termálna');const ok=parts.join(', ');const alt=[['minerálna','uhličitá','termálna'],['minerálna','termálna'],['minerálna','uhličitá'],['minerálna'],['nie je minerálna'],['nie je minerálna','termálna']].map(a=>a.join(', '));return mc(`Vzorka: rozpustené látky ${num(M)} mg/l, CO₂ ${num(C)} mg/l, teplota ${T} °C. Ako ju klasifikuješ?`,ok,alt,'Pravidlá: minerálna nad 1 000 mg/l rozpustených látok alebo CO₂; uhličitá nad 1 000 mg/l CO₂; termálna nad 20 °C.')},
   ()=>mc('Prečo sa minerálne pramene na Slovensku často viažu na zlomy?','zlomy umožňujú hlboký obeh vody a výstup plynov',['na zlomoch viac prší','zlomy sú vždy v nížinách','na zlomoch je teplejšie podnebie'],'Po zlomoch voda preniká do hĺbky, ohreje sa, obohatí sa a opäť vystúpi.'),
   ()=>{const p=pick([['Piešťany','sírovodíková termálna'],['Bardejovské Kúpele','uhličitá studená (kyselka)'],['Číž','jódovo-brómová'],['Smrdáky','sírovodíková']]);return mc(`Aký typ vody je typický pre: ${p[0]}?`,p[1],['sírovodíková termálna','uhličitá studená (kyselka)','jódovo-brómová','sírovodíková','sladká povrchová'],`${p[0]} – ${p[1]} voda.`)},
   ()=>mc('Čo spôsobuje erupcie studeného gejzíra v Herľanoch?','tlak oxidu uhličitého nahromadeného vo vrte',['magma pod gejzírom','príliv a odliv','čerpadlo'],'Ide o studený gejzír – hnacou silou je CO₂, nie teplo.'),
   ()=>mc('Ktoré využitie termálnych vôd je energetické?','vykurovanie budov geotermálnou vodou',['pitná kúra','termálne kúpalisko','výroba travertínu'],'Geotermálna energia sa využíva napr. na vykurovanie v Galante.')
  ]}

  ],
  ss:[
   {h:'Vodné toky',p:'<b>Bystrina</b> (krátky, prudký tok s náhlymi zmenami prietoku), <b>potok</b>, <b>rieka</b>, <b>veľtok</b> (dĺžka nad 500 km, povodie nad 100 000 km²). Dĺžka toku = vzdialenosť od prameňa po ústie.'},
   {h:'Erózia, transport, akumulácia',p:'V hornom toku prevláda <b>hĺbková erózia</b>, v strednom <b>bočná</b> (meandre). Rieka prenáša <b>splaveniny</b> (vlečené po dne) a <b>plaveniny</b> (vznášané vo vode). Pri poklese rýchlosti ich ukladá – nivy, náplavové kužele, delty.'},
   {h:'Vodný stav a prietok',p:'<b>Vodný stav</b> – výška hladiny nad nulou vodomernej laty. <b>Prietok</b> – objem vody, ktorý pretečie profilom za sekundu: <span class="k">Q = v · S</span> (m³/s), kde S je plocha prietokového profilu.'},
   {h:'Režim odtoku',p:'Zmeny prietoku počas roka. Ovplyvňuje ho podnebie, zdroj vody (dážď, sneh, ľadovec), reliéf, horniny a vegetácia. Typy: <b>ľadovcový</b> (maximum v lete – Rhôna), <b>snehový</b> (maximum na jar – Volga), <b>monzúnový</b> (maximum v období dažďov – Ganga), <b>vyrovnaný rovníkový</b> (Kongo).'},
   {h:'Slovenské rieky',p:'Väčšina má maximum na jar (marec – apríl) z topenia snehu, minimum v lete a na jeseň. Dunaj má maximum až začiatkom leta – prináša vodu z Álp.'},
   {h:'Tvar riečnej siete',p:'Stromovitá, perovitá, pravouhlá, vejárovitá, lúčovitá (z vrchu na všetky strany) a dostredivá (do kotliny). Tvar závisí od reliéfu a horninového podložia.'}
  ]},
 quiz:{
  zs:[
   ()=>{const x=pick([['hĺbi koryto a odnáša balvany','horný tok'],['tečie pomaly a ukladá piesok a bahno','dolný tok'],['ukladá štrk a začína sa kľukatiť','stredný tok']]);return mc(`V ktorej časti rieka ${x[0]}?`,x[1],['horný tok','stredný tok','dolný tok'],'Horný tok hĺbi, stredný ukladá štrk, dolný ukladá jemný materiál.')},
   ()=>{const dirs=[['na juh','západ','pravý'],['na juh','východ','ľavý'],['na sever','západ','ľavý'],['na sever','východ','pravý'],['na východ','sever','ľavý'],['na východ','juh','pravý'],['na západ','sever','pravý'],['na západ','juh','ľavý']];const d=pick(dirs);return mc(`Rieka tečie ${d[0]}. Prítok do nej priteká zo strany, kde je ${d[1]}. Je to ľavý, alebo pravý prítok?`,`${d[2]} prítok`,['ľavý prítok','pravý prítok'],`Postav sa tak, aby si sa pozeral po smere toku (${d[0]}). ${d[1][0].toUpperCase()+d[1].slice(1)} je potom po tvojej ${d[2]==='ľavý'?'ľavej':'pravej'} ruke.`)},
   ()=>mc('Ako vzniká mŕtve rameno?','rieka preseká meander a starý oblúk sa oddelí',['človek vykope jamu','rieka vyschne v lete','vznikne pri prameni'],'Mŕtve rameno je bývalý meander oddelený od koryta.'),
   ()=>mc('Ako sa nazýva ústie rozvetvené na viac ramien v tvare trojuholníka?','delta',['meander','sútok','estuár'],'Delta je pomenovaná podľa gréckeho písmena Δ.'),
   ()=>mc('Kde nájdeme najväčšie kamene a balvany v koryte?','v hornom toku',['v dolnom toku','pri ústí','v delte'],'Rýchla voda v hornom toku unesie aj veľké kamene, ďalej sa obrusujú a zmenšujú.'),
   ()=>mc('Ako sa nazýva miesto, kde sa stretnú dve rieky?','sútok',['prameň','ústie do mora','meander'],'Sútok – miesto spojenia dvoch tokov.')
  ],
  ss:[
   ()=>{const v=RF(0.5,2.2,1),b=R(20,90),h=RF(1,4,1);const Q=v*b*h;return mc(`Rieka má v profile šírku ${b} m, priemernú hĺbku ${num(h,1)} m a priemernú rýchlosť ${num(v,1)} m/s. Aký je prietok?`,`${num(Q,0)} m³/s`,nd(Q,0,' m³/s'),`Q = v · S = ${num(v,1)} · (${b} · ${num(h,1)}) = ${num(Q,0)} m³/s.`)},
   ()=>{const x=pick([['maximum v júli z topenia ľadovcov','ľadovcový'],['maximum v máji z topenia snehu na rovinách','snehový'],['maximum v auguste a septembri v období letných dažďov','monzúnový'],['počas roka málo kolíše, prší celoročne','vyrovnaný rovníkový']]);return mc(`Rieka má ${x[0]}. Aký má režim odtoku?`,x[1],['ľadovcový','snehový','monzúnový','vyrovnaný rovníkový'],'Režim odtoku zodpovedá zdroju vody a podnebiu v povodí.')},
   ()=>mc('Ktorý údaj je vodný stav?','výška hladiny nad nulou vodomernej laty',['objem vody za sekundu','dĺžka toku','plocha povodia'],'Vodný stav sa meria v cm na vodomernej late; prietok v m³/s.'),
   ()=>mc('Čím sa líšia splaveniny od plavenín?','splaveniny sa vlečú po dne, plaveniny sa vznášajú vo vode',['splaveniny sú organické, plaveniny minerálne','plaveniny sú väčšie','nijako'],'Ťažší materiál sa pohybuje po dne, jemný je unášaný vo vode.'),
   ()=>mc('Prečo má Dunaj v Bratislave najvyšší prietok začiatkom leta, a nie na jar ako väčšina slovenských riek?','prináša vodu z topiaceho sa snehu a ľadovcov v Alpách',['v lete na Slovensku najviac sneží','v lete sa otvárajú priehrady','na jar Dunaj zamŕza'],'Alpský sneh a ľadovce sa topia neskôr ako sneh v našich nižších pohoriach.'),
   ()=>mc('Kde vzniká skôr estuár ako delta?','pri mori so silným prílivom a odlivom, ktorý odnáša nánosy',['pri vnútrozemskom mori bez prílivu','pri rieke, ktorá nesie veľa nánosov do pokojného mora','v horách'],'Silné slapové prúdy nánosy odnášajú, takže sa delta nevytvorí.')
  ]}

{id:'povodie',title:'Povodie a úmorie',short:'Kam dotečie voda zo Slovenska',
 intro:{
  zs:['Na hrebeni hôr sa rozhoduje. Kvapka na jednej strane poputuje do iného mora ako jej sestra na druhej strane.','Takej hranici hovoríme rozvodie.','Zistime, kam odteká voda zo Slovenska.'],
  ss:['Mapujeme hydrografickú sieť. Základnou jednotkou je povodie.','Slovenskom prechádza hlavné európske rozvodie medzi Čiernym a Baltským morom.','Úloha: určiť úmorie, vypočítať hustotu riečnej siete a špecifický odtok.']},
 goal:{zs:'Vysvetlíš pojmy povodie, rozvodie a úmorie a určíš, do ktorého mora odteká voda z tvojho okolia.',ss:'Analyzuješ hydrografickú sieť SR a vypočítaš jej charakteristiky.'},
 learn:{
  zs:[
   {h:'Riečna sieť',p:'Hlavná rieka so všetkými prítokmi.'},
   {h:'Povodie',p:'Územie, z ktorého všetka voda steká do jednej rieky – hlavného toku a jeho prítokov.'},
   {h:'Rozvodie',p:'Hranica medzi povodiami. Najčastejšie vedie po <b>hrebeňoch hôr</b>.'},
   {h:'Úmorie',p:'Územie, z ktorého všetky rieky odvádzajú vodu do <b>toho istého mora</b>.'},
   {h:'Slovensko a dve moria',p:'Asi <b>96 %</b> územia patrí do úmoria <b>Čierneho mora</b> (cez Dunaj). Sever – rieky Poprad a Dunajec – patrí do úmoria <b>Baltského mora</b> (cez Vislu).',f:'Voda z Michaloviec tečie: Laborec → Latorica → Bodrog → Tisa → Dunaj → Čierne more.',w:1},
   {h:'Bezodtoková oblasť',p:'Územie, odkiaľ rieky nedotečú do oceánu, ale končia v jazere alebo sa stratia v púšti (napríklad okolie Kaspického mora).'}
  ],
  ss:[
   {h:'Povodie a rozvodnica',p:'Povodie je základná hydrologická jednotka – územie, z ktorého tok s prítokmi odvádza povrchovú aj podzemnú vodu. Ohraničuje ho rozvodnica. <b>Povrchové a podzemné rozvodie sa nemusia zhodovať</b>, najmä v krase.'},
   {h:'Úmorie',p:'Územie odvodňované do toho istého mora alebo oceánu. Najväčšie je úmorie Atlantického oceánu. Asi pätina pevnín je <b>bezodtoková</b>.'},

   {h:'Špecifický odtok',p:'<span class="k">q = Q / A</span> – množstvo vody, ktoré odtečie z 1 km² povodia za sekundu (l·s⁻¹·km⁻²). Umožňuje porovnať vodnatosť povodí rôznej veľkosti.'},
   {h:'Hlavné európske rozvodie v SR',p:'Oddeľuje úmorie Čierneho mora (asi 96 % SR) od Baltského (povodia Popradu a Dunajca). Prechádza napríklad pri Štrbe, Spišskou Magurou a Levočskými vrchmi.'},
   {h:'Povodia SR',p:'Hlavné povodia: Morava, Dunaj, Váh (s Nitrou), Hron, Ipeľ, Slaná, Bodva, Hornád, Bodrog, Poprad a Dunajec. Najväčšie je povodie Váhu.'}
  ]},
 quiz:{
  zs:[
   ()=>{const c=pick(CITIES);const s=RIVERS[c.r].sea==='C'?'Čierne more':'Baltské more';return mc(`Kvapka spadla v meste ${c.n} do rieky ${RIVERS[c.r].n}. Do ktorého mora dotečie?`,s,['Čierne more','Baltské more','Severné more','Jadranské more'],`${RIVERS[c.r].chain.join(' → ')} → ${s}.`)},
   ()=>{const x=pick([['územie, z ktorého voda steká do jednej rieky','povodie'],['hranica medzi povodiami','rozvodie'],['územie, z ktorého rieky odvádzajú vodu do toho istého mora','úmorie'],['hlavná rieka so všetkými prítokmi','riečna sieť']]);return mc(`Ktorý pojem znamená: ${x[0]}?`,x[1],['povodie','rozvodie','úmorie','riečna sieť'],`${x[1][0].toUpperCase()+x[1].slice(1)} – ${x[0]}.`)},
   ()=>mc('Kade najčastejšie vedie rozvodie?','po hrebeňoch hôr',['po dne dolín','pozdĺž riek','po brehu mora'],'Z hrebeňa steká voda na obe strany – do rôznych povodí.'),
   ()=>mc('Ktoré slovenské rieky patria do úmoria Baltského mora?','Poprad a Dunajec',['Váh a Hron','Laborec a Ondava','Morava a Dunaj'],'Poprad sa vlieva do Dunajca, ten do Visly a Visla do Baltského mora.'),
   ()=>mc('Aká je cesta vody z Michaloviec do mora?','Laborec → Latorica → Bodrog → Tisa → Dunaj → Čierne more',['Laborec → Hornád → Visla → Baltské more','Laborec → Váh → Dunaj → Čierne more','Laborec → Ondava → Poprad → Baltské more'],'Laborec ústi do Latorice, tá s Ondavou tvorí Bodrog, ten sa vlieva do Tisy a Tisa do Dunaja.'),
   ()=>mc('Do úmoria ktorého mora patrí väčšina Slovenska?','Čierneho mora',['Baltského mora','Severného mora','Stredozemného mora'],'Asi 96 % územia SR odvodňuje Dunaj do Čierneho mora.')
  ],
  ss:[
   ()=>{const A=R(30,150)*10,L=Math.round(A*RF(0.4,1.6,2));const r=L/A;return mc(`Povodie má plochu ${num(A)} km² a súčet dĺžok všetkých tokov ${num(L)} km. Aká je hustota riečnej siete?`,`${num(r,2)} km/km²`,nd(r,2,' km/km²'),`r = ${num(L)} / ${num(A)} = ${num(r,2)} km/km².`)},
   ()=>{const A=R(5,40)*100,Q=R(10,90);const q=Q*1000/A;return mc(`Z povodia s plochou ${num(A)} km² odteká priemerne ${Q} m³/s. Aký je špecifický odtok?`,`${num(q,1)} l·s⁻¹·km⁻²`,nd(q,1,' l·s⁻¹·km⁻²'),`q = Q / A = ${Q} 000 l/s / ${num(A)} km² = ${num(q,1)} l·s⁻¹·km⁻².`)},
   ()=>mc('Prečo sa v krasových územiach nemusí povrchové rozvodie zhodovať s podzemným?','voda môže pod zemou odtekať puklinami a jaskyňami do iného povodia',['v krase nie sú zrážky','v krase tečú rieky hore kopcom','povrchové rozvodie v krase neexistuje'],'Ponory a podzemné toky môžu preniesť vodu popod rozvodnicu do susedného povodia.'),
   ()=>{const c=pick(CITIES.filter(x=>RIVERS[x.r].chain.length>=3));const ch=RIVERS[c.r].chain;const fake=shuffle(ch.slice(1));return mc(`Ktorá postupnosť správne opisuje cestu vody z mesta ${c.n}?`,ch.join(' → '),[[ch[0],...fake].join(' → '),[...ch].reverse().join(' → '),[ch[0],'Hron','Dunaj'].join(' → ')],`Správne: ${ch.join(' → ')} → ${RIVERS[c.r].sea==='C'?'Čierne':'Baltské'} more.`)},
   ()=>mc('Prečo má krasové územie malú hustotu riečnej siete?','voda rýchlo vsakuje do puklín a odteká pod zemou',['je tam málo zrážok','krasové územia sú vždy rovinaté','rieky v krase zamŕzajú'],'Vysoká priepustnosť vápencov znižuje povrchový odtok.'),
   ()=>mc('Ktorá oblasť je bezodtoková?','povodie Kaspického mora',['povodie Dunaja','povodie Amazonky','povodie Visly'],'Rieky ako Volga sa vlievajú do Kaspického mora, ktoré nemá spojenie so svetovým oceánom.')
  ]}
},

   {h:'Rekordy',p:'Najväčšie jazero rozlohou je Kaspické more. Najhlbšie je Bajkal (vyše 1 600 m) – obsahuje asi pätinu povrchovej sladkej vody sveta.'},
   {h:'Ľadovce',p:'Sneh sa mení na firn a potom na ľad. <b>Horské</b> (údolné, karové) a <b>pevninské</b> (kontinentálne štíty). Ľadovec modeluje <b>kary</b>, <b>trogy</b> (doliny v tvare U) a <b>morény</b>.'},

 zs:[
  {w:'sk',cam:[460,650,380],title:1,amb:'waves'},
  {say:['kubo','Dron je nabitý a kamera beží. Môžem ho vypustiť?']},
  {say:['hana','Leť. A sleduj na displeji, čo sa deje nad hladinou.']},
  ACT(null,'Vypusti dron','drone'),
  {sfx:'whoosh',amb:'wind+waves',cls:'+evap',mv:[{k:'drone',to:[700,520],s:.8,dur:3500,follow:{w:700,dy:60}}],fx:{t:'steam',y:.8},wait:2500},
  {cam:[760,560,1000],cd:2500,say:['hana','Vidíte tie jemné závoje? Slnko ohrieva hladinu a voda sa mení na neviditeľnú vodnú paru. To je výpar.']},
  {cls:'+grow',cam:[840,440,950],cd:3000,mv:[{k:'drone',to:[1000,470],dur:3000}],say:['nela','Hore sa z ničoho nič robí oblak!']},
  {say:['hana','Vo výške je chladnejšie. Para sa ochladí a zmení na drobné kvapôčky – kondenzácia. Miliardy takých kvapôčok tvoria oblak.']},
  {cls:'+wind',fx:null,mv:[{k:'cl',to:[2600,360],dur:10000,follow:{w:1200,dy:80}},{k:'drone',to:[2760,440],dur:10000}],say:['kubo','Vietor ho ženie preč od mora… smerom k horám!']},
  {say:['hana','Takto sa voda z oceánu dostane nad pevninu. Výpar nad morom, prenos vetrom a dážď nad horami – to je veľký kolobeh vody.']},
  {cls:'+storm',flash:1,amb:'storm',fx:'storm',cam:[2600,520,1300],cd:2000,say:['nela','Hrom! Začína pršať!']},
  {say:['hana','Zrážky. Naša kvapka práve dopadla na svah v horách. Časť vody stečie, časť vsiakne do zeme. My pôjdeme za ňou.']},
  {flash:1,wait:1500}
 ],
 ss:[
  {w:'sk',cam:[460,650,380],title:1,amb:'waves'},
  {say:['matej','Meteorologický dron pripravený. Senzory teploty, vlhkosti a tlaku bežia.']},
  {say:['hana','Vypusti ho. Chceme vidieť veľký obeh vody v priamom prenose.']},
  ACT(null,'Vypusti dron','drone'),
  {sfx:'whoosh',amb:'wind+waves',cls:'+evap',mv:[{k:'drone',to:[700,520],s:.8,dur:3500,follow:{w:700,dy:60}}],fx:{t:'steam',y:.8},wait:2500},
  {cam:[760,560,1000],cd:2500,say:['hana','Evaporácia. Nad subtropickým Atlantikom výpar prevyšuje zrážky. Voda odchádza, soli zostávajú – preto je tu oceán slanší.']},
  {say:['lucia','Zapíšte si to. Pomer výparu a zrážok riadi slanosť mora. Možno to súvisí s našou šošovkou.']},
  {cls:'+grow',cam:[840,440,950],cd:3000,mv:[{k:'drone',to:[1000,470],dur:3000}],say:['matej','Vzduch stúpa a ochladzuje sa. Para kondenzuje na drobných jadrách – kryštálikoch morskej soli a prachu.']},
  {cls:'+wind',fx:null,mv:[{k:'cl',to:[2600,360],dur:10000,follow:{w:1200,dy:80}},{k:'drone',to:[2760,440],dur:10000}],say:['hana','Advekcia. Západné prúdenie nesie vlhký vzduch nad Európu. Bez nej by nebol veľký obeh – voda by pršala späť do oceánu.']},
  {say:['matej','Pred nami sú hrebene. Vzduch ich musí prekonať…']},
  {cls:'+storm',flash:1,amb:'storm',fx:'storm',cam:[2600,520,1300],cd:2000,say:['lucia','…ochladí sa a vyprší na náveternej strane. Orografické zrážky, presne podľa učebnice.']},
  {say:['hana','Časť vody odtečie, časť sa vyparí a časť vsiakne. Lucia, priprav laná – ideme do krasu.']},
  {flash:1,wait:1500}
 ]},
podzemie:{loc:'Krasové územie · Nízke Tatry',worlds:{ks:wKarst},endT:{zs:'Zelená voda vyvrela z vyvieračky',ss:'Stopa: hlboká voda sa v horninách zdrží stovky rokov'},
 zs:[
  {w:'ks',cam:[560,400,700],title:1,amb:'rain',fx:{t:'rain',rate:80}},
  {cam:[600,420,560],say:['nela','Pozrite! Potok tu jednoducho zmizne v zemi.']},
  {say:['hana','To je ponor. Sme v krase – pod nami je vápenec. Voda ho tisíce rokov rozpúšťa a vytvára v ňom pukliny a jaskyne.']},
  {say:['kubo','Mám tú zelenú farbu. Naozaj ju môžem naliať?']},
  {say:['hana','Áno, je neškodná. Je to stopovacia látka. Keď sa zelená voda niekde objaví, budeme vedieť, kam potok tečie.']},
  ACT([642,452],'Nalej stopovač do ponoru'),
  {cls:'+go',sfx:'splash',wait:900},
  {cam:[700,620,560],cd:3200,amb:'cave',fx:'drips',wait:1500},
  {cls:'+incave',cam:[840,780,560],cd:2500,say:['kubo','Tu je jaskyňa! Zo stropu kvapká voda a rastú tu kvaple.']},
  {say:['hana','Kvaple rastú veľmi pomaly – z vápnika, ktorý voda najprv rozpustila a potom ho tu zase zanechala.']},
  {cam:[620,960,900],cd:3000,say:['nela','A čo je tá modrá prerušovaná čiara?']},
  {say:['hana','Hladina podzemnej vody. Nad ňou je v horninách aj vzduch. Pod ňou sú všetky pukliny a póry úplne plné vody.']},
  {cam:[1300,1030,620],cd:3500,fx:null,amb:'river',say:['kubo','Tam vyteká zelená voda! To je naša kvapka!']},
  {say:['hana','To je vyvieračka – miesto, kde podzemná voda vyviera na povrch. Za pár dní prešla celým podzemím.']},
  {cam:[800,900,1600],cd:3000,say:['nela','A kam ide voda, ktorá vsiakne ešte hlbšie?']},
  {say:['hana','Môže tam zostať stovky rokov. Zajtra uvidíte takú vodu z hĺbky – a bude strieľať do výšky!']}
 ],
 ss:[
  {w:'ks',cam:[560,400,700],title:1,amb:'rain',fx:{t:'rain',rate:80}},
  {cam:[600,420,560],say:['lucia','Ponor. Povrchový tok tu mizne v systéme puklín a jaskýň – typický krasový jav.']},
  {say:['hana','Ideálne miesto na stopovaciu skúšku. Lucia, fluoresceín.']},
  {say:['lucia','Fluorometre na vyvieračkách zachytia aj miliardtiny gramu. Vpúšťam.']},
  ACT([642,452],'Vpusti fluoresceín'),
  {cls:'+go',sfx:'splash',wait:900},
  {cam:[700,620,560],cd:3200,amb:'cave',fx:'drips',wait:1500},
  {cls:'+incave',cam:[840,780,560],cd:2500,say:['matej','Sme v zóne prevzdušnenia. Póry sú tu čiastočne vyplnené vzduchom a voda nimi len presakuje nadol.']},
  {say:['lucia','Sintrová výzdoba. Vápenec sa rozpúšťa vo vode s CO₂ a na inom mieste sa zase vyzráža – vznikajú kvaple.']},
  {cam:[620,960,900],cd:3000,say:['hana','Hladina podzemnej vody. Pod ňou je zóna nasýtenia – všetky póry a pukliny sú zaplnené vodou.']},
  {cam:[1300,1030,620],cd:3500,fx:null,amb:'river',say:['lucia','Stopovač na vyvieračke! Krasová voda prúdi rýchlo, širokými kanálmi.']},
  {say:['hana','Ale v hlbokých kolektoroch sa voda zdrží stovky až tisíce rokov. Celý ten čas rozpúšťa horniny. Čím hlbšie a dlhšie, tým vyššia mineralizácia.']},
  {cam:[800,900,1600],cd:3000,say:['matej','Hlboká, silno mineralizovaná voda… Myslíš to isté čo ja, Hana?']},
  {say:['hana','Áno. Overíme to na najznámejšom prameni na východe. Ideme do Herľan.']}
 ]},
pramene:{loc:'Herľany · Slanské vrchy',worlds:{gy:wGeyser},endT:{zs:'Gejzír vystrelil vyše 10 metrov vysoko',ss:'Stopa: mineralizácia rastie s hĺbkou a časom'},
 zs:[
  {w:'gy',cam:[650,560,700],title:1,amb:'wind'},
  {say:['nela','Prečo všetci čakajú pri tej rúre za plotom?']},
  {say:['hana','To je gejzír v Herľanoch. Voda z hĺbky je plná oxidu uhličitého – rovnakého plynu, ktorý robí bublinky v kyselke.']},
  {cam:[800,1080,1050],cd:3500,say:['kubo','Tie bublinky idú až z takej hĺbky?']},
  {say:['hana','Áno. Plyn sa hromadí vo vrte a rastie tlak. Keď je ho dosť, vystrelí vodu von.']},
  {cam:[760,540,800],cd:3000,hud:{l:'ERUPCIA ZA',from:6,to:0,u:' s',dur:6000},say:['nela','Už to začína bublať!']},
  {wait:2500},
  {cls:'+erupt -calm',hud:0,sfx:'geyser',fx:[{t:'spray',at:[800,140],v:120,spread:300,rate:160},{t:'steam',y:.55}],cam:[800,430,1300],cd:2500,say:['kubo','Juuuj! Je vyšší ako náš dom!']},
  {say:['hana','Strieka vyše desať metrov. A je to studený gejzír – nepoháňa ho teplo, ale plyn.']},
  {cls:'+rb',say:['nela','A pozrite – dúha!']},
  {say:['hana','Voda z hĺbky je minerálna. Rozpustila v sebe veľa látok z hornín. Na Slovensku máme aj teplé, termálne pramene – napríklad v Piešťanoch.']},
  {say:['kubo','A kde je medzitým naša zelená kvapka?']},
  {say:['hana','Tečie potokom k rieke. Zajtra ju dobehneme – na člne!']}
 ],
 ss:[
  {w:'gy',cam:[650,560,700],title:1,amb:'wind'},
  {say:['lucia','Herľany. Vrt tu navŕtali v 19. storočí a odvtedy z neho v pravidelných intervaloch strieka voda.']},
  {cam:[800,1080,1050],cd:3500,say:['matej','Pod nami je zvodnená vrstva nasýtená CO₂. Plyn stúpa po zlomoch aj vrtom.']},
  {say:['lucia','Plyn sa hromadí pod vodným stĺpcom. Keď jeho tlak prevýši váhu vody nad ním, nastane erupcia.']},
  {cam:[760,540,800],cd:3000,say:['hana','Analýza: rozpustené látky nad 1 000 mg/l, CO₂ nad 1 000 mg/l, teplota pod 20 °C. Studená uhličitá minerálna voda.']},
  {hud:{l:'ERUPCIA ZA',from:6,to:0,u:' s',dur:6000},wait:6000},
  {cls:'+erupt -calm',hud:0,sfx:'geyser',fx:[{t:'spray',at:[800,140],v:120,spread:300,rate:160},{t:'steam',y:.55}],cam:[800,430,1300],cd:2500,say:['matej','Erupcia! Odhadovaná výška stĺpca vyše 10 metrov.']},
  {cls:'+rb',say:['lucia','Termálne vody vznikajú inak: voda klesá po zlomoch do hĺbky a geotermálny gradient ju ohreje – asi o 3 °C na každých 100 metrov.']},
  {say:['hana','A čím dlhšie a hlbšie voda putuje, tým viac látok rozpustí. Zapamätajte si to – rozpustené látky a slanosť sú kľúčom k našej šošovke.']},
  {say:['matej','Medzitým stopovač z krasu dorazil do rieky. Hydrometrická loďka je pripravená.']}
 ]},
rieka:{loc:'Od vyvieračky po nížinu',worlds:{rv:wRiver,ae:wAerial},endT:{zs:'Splavili ste rieku od prameňa po nížinu',ss:'Stopa: celé povodie odteká jedným smerom'},
 zs:[
  {w:'rv',cam:[300,350,700],title:1,amb:'river'},
  {say:['hana','Z vyvieračky vznikol potok. Pridali sa k nemu ďalšie potoky – a vznikla rieka. Nasadnite!']},
  {cam:[500,450,560],cd:2500,say:['kubo','Hneď pod vodopádom? To bude jazda!']},
  ACT(null,'Odraziť sa','raft'),
  {sfx:'splash',al:{k:'raft',p:'rpath',x0:520,x1:1000,dur:7000,follow:{w:700,dy:-60}},fx:{t:'spray',at:[452,462],v:150,spread:160,rate:70},say:['nela','Tu je to riadne rýchle!']},
  {say:['hana','Horný tok. Strmý sklon, rýchla voda. Rieka hĺbi koryto a valí so sebou aj veľké kamene.']},
  {fx:null,al:{k:'raft',p:'rpath',x0:1000,x1:1800,dur:8000,follow:{w:850,dy:-80}},say:['kubo','Teraz už tečie pokojnejšie.']},
  {say:['hana','Stredný tok. Sklon je menší, rieka ukladá štrk a začína sa kľukatiť.']},
  {al:{k:'raft',p:'rpath',x0:1800,x1:2500,dur:7000,follow:{w:950,dy:-80}},say:['nela','Tu je už takmer rovina. Rieka je široká a pomalá.']},
  {say:['hana','Dolný tok. Rieka tu ukladá piesok a bahno. Pozrite sa na to zhora – pustíme dron.']},
  {w:'ae',sfx:'whoosh',amb:'wind',cam:[800,500,1500],al:{k:'raft2',p:'apath',f0:.02,f1:.6,dur:18000,rot:'full'},say:['kubo','Wau! Rieka sa vlní ako had!']},
  {say:['hana','Tie veľké oblúky sú meandre. A to oddelené jazierko je mŕtve rameno – kedysi ním tiekla rieka, potom si našla kratšiu cestu.']},
  {say:['nela','A kam tá rieka vlastne tečie?']},
  {say:['hana','To zistíme na hrebeni hôr. Tam sa rozhoduje, do ktorého mora voda dotečie.']}
 ],
 ss:[
  {w:'rv',cam:[300,350,700],title:1,amb:'river'},
  {say:['hana','Hydrometrický prieskum. Na troch profiloch zmeriame rýchlosť, prierez a prietok: Q = v · S.']},
  {cam:[500,450,560],cd:2500,say:['matej','ADCP sonda na člne meria rýchlosť prúdu ultrazvukom. Štartujeme pod vodopádom.']},
  ACT(null,'Spusti meranie','raft'),
  {sfx:'splash',hud:{l:'PRIETOK',from:2,to:6,u:' m³/s',dur:7000},al:{k:'raft',p:'rpath',x0:520,x1:1000,dur:7000,follow:{w:700,dy:-60}},fx:{t:'spray',at:[452,462],v:150,spread:160,rate:70},say:['lucia','Horný tok: veľký sklon, prevláda hĺbková erózia. Splaveniny – balvany a štrk – sa valia po dne.']},
  {fx:null,hud:{l:'PRIETOK',from:6,to:24,u:' m³/s',dur:8000},al:{k:'raft',p:'rpath',x0:1000,x1:1800,dur:8000,follow:{w:850,dy:-80}},say:['matej','Stredný tok: sklon klesá, rieka eroduje do strán a ukladá štrkové lavice.']},
  {hud:{l:'PRIETOK',from:24,to:48,u:' m³/s',dur:7000},al:{k:'raft',p:'rpath',x0:1800,x1:2500,dur:7000,follow:{w:950,dy:-80}},say:['hana','Prietok rastie s každým prítokom. Dolný tok: akumulácia, široká niva, jemné plaveniny.']},
  {w:'ae',sfx:'whoosh',amb:'wind',hud:0,cam:[800,500,1500],al:{k:'raft2',p:'apath',f0:.02,f1:.6,dur:18000,rot:'full'},say:['lucia','Zhora vidno meandre. Na vonkajšej strane oblúka rieka eroduje, na vnútornej ukladá štrk a piesok.']},
  {say:['matej','A tamto je mŕtve rameno – zaškrtený meander. Pri povodni rieka preťala šiju oblúka.']},
  {say:['hana','Režim odtoku tejto rieky: maximum na jar z topenia snehu, minimum koncom leta. Typické pre naše hory.']},
  {say:['lucia','Každá kvapka z tohto povodia skončí v tom istom mori. Ktorom? To uvidíme na rozvodí.']}
 ]},
povodie:{loc:'Hlavné európske rozvodie · Štrba',worlds:{rd:wRidge},endT:{zs:'Slovensko patrí k dvom moriam',ss:'Stopa: 96 % SR odteká do Čierneho mora'},
 zs:[
  {w:'rd',cam:[720,260,560],title:1,amb:'wind'},
  {say:['hana','Stojíme na hrebeni hôr. Práve tadiaľto vedie hlavné európske rozvodie.']},
  {say:['kubo','Rozvodie? Čo to je?']},
  {fx:{t:'rain',rate:60},cam:[800,320,800],cd:2500,say:['hana','Hranica, ktorá rozhoduje, kam voda poputuje. Pozrite – prší na oba svahy naraz.']},
  ACT([786,222],'Pošli kvapku doľava'),
  {cls:'+goL',sfx:'whoosh',cam:[420,600,1500],cd:3500,wait:2500},
  {say:['hana','Kvapka zo západného svahu steká do Váhu, potom do Dunaja… až do Čierneho mora.']},
  {cam:[800,320,800],cd:2500},
  ACT([814,222],'Pošli kvapku doprava'),
  {cls:'+goR',sfx:'whoosh',cam:[1180,600,1500],cd:3500,wait:2500},
  {say:['hana','A tá z druhej strany tečie do Popradu, Dunajca a Visly – až do Baltského mora.']},
  {inset:'divide',cam:[800,500,1600],cd:2500,say:['nela','Takže Slovensko patrí k dvom moriam!']},
  {say:['hana','Presne tak. Ale asi 96 % územia odvádza Dunaj do Čierneho mora. Územie, z ktorého tečie voda do jedného mora, je úmorie.']},
  {inset:0,say:['kubo','A naša zelená kvapka?']},
  {say:['hana','Ide do Váhu. Ale cestou narazí na niečo, čo postavili ľudia – obrovskú hrádzu.']}
 ],
 ss:[
  {w:'rd',cam:[720,260,560],title:1,amb:'wind'},
  {say:['hana','Hlavné európske rozvodie. Rozvodnica tu oddeľuje úmorie Čierneho a Baltského mora.']},
  {say:['lucia','Pozor však: v krase sa povrchové a podzemné rozvodie nemusia zhodovať. Voda môže podzemím pretiecť do susedného povodia.']},
  {fx:{t:'rain',rate:60},cam:[800,320,800],cd:2500,say:['matej','Zrážky padajú na oba svahy. Sledujeme dve kvapky.']},
  ACT([786,222],'Sleduj západnú kvapku'),
  {cls:'+goL',sfx:'whoosh',cam:[420,600,1500],cd:3500,wait:2500},
  {say:['hana','Váh, Dunaj, Čierne more. Povodie Váhu je najväčšie na Slovensku.']},
  {cam:[800,320,800],cd:2500},
  ACT([814,222],'Sleduj východnú kvapku'),
  {cls:'+goR',sfx:'whoosh',cam:[1180,600,1500],cd:3500,wait:2500},
  {say:['lucia','Poprad, Dunajec, Visla, Baltské more. Len malý kúsok severu Slovenska.']},
  {inset:'divide',cam:[800,500,1600],cd:2500,say:['matej','Asi 96 % územia SR odvádza Dunaj do Čierneho mora.']},
  {say:['hana','A Čierne more je cez Bospor spojené so Stredozemným morom…']},
  {inset:0,say:['lucia','…ktoré je slané, lebo sa z neho veľa vyparuje. Hana, začína to dávať zmysel.']},
  {say:['hana','Ešte nie celkom. Najprv sa pozrieme, čo s riekou robia ľudia. Ideme na Oravu.']}
 ]},
jazera:{loc:'Oravská priehrada',worlds:{dm:wDam},endT:{zs:'Pod hladinou ste našli zatopenú obec',ss:'Stopa: nádrže menia režim odtoku'},
 zs:[
  {w:'dm',cam:[1100,470,600],title:1,amb:'wind+waves',cls:'+hum'},
  {say:['ondrej','Vitajte na Oravskej priehrade! Hrádza zadržiava vodu a tá roztáča turbíny v elektrárni.']},
  {cam:[430,500,600],cd:3000,say:['kubo','Tamto je ostrov s kostolíkom!']},
  {say:['ondrej','To je Slanický ostrov. Kedysi to bol kopec nad obcou Slanica. Keď napustili priehradu, obec zmizla pod vodou.']},
  {cam:[1060,560,600],cd:2500,say:['nela','Pod vodou? Dá sa to vidieť?']},
  {say:['ondrej','S podvodným dronom áno. Chceš ho riadiť?']},
  ACT(null,'Ponor podvodný dron','rov'),
  {cls:'+uw',sfx:'splash',amb:'deep',fx:{t:'bubbles',k:'rov',rate:12},mv:[{k:'rov',to:[930,900],dur:4500,follow:{w:700}}],wait:3500},
  {mv:[{k:'rov',to:[900,1050],dur:3000,follow:{w:650}}],say:['nela','Vidím staré základy domov… a cestu!']},
  {say:['ondrej','Pod hladinou sú zvyšky viacerých obcí. Priehrada chráni pred povodňami a vyrába elektrinu, ale ľudia sa museli vysťahovať.']},
  {fx:null,cam:[600,700,1500],cd:3000,amb:'wind+waves',say:['hana','Jazerá vznikajú aj prirodzene. Tatranské plesá vyhĺbil ľadovec a Morské oko vo Vihorlate prehradil zosuv pôdy.']},
  {sfx:'siren',cam:[1100,470,600],cd:2500,say:['ondrej','Pozor – práve prišla výstraha. Na dolnom toku sa blíži silná búrka. Potrebujeme vašu pomoc!']}
 ],
 ss:[
  {w:'dm',cam:[1100,470,600],title:1,amb:'wind+waves',cls:'+hum'},
  {say:['ondrej','Vodné dielo Orava. Nádrž zachytí povodňovú vlnu, vyrába elektrinu a vyrovnáva prietoky Váhu počas roka.']},
  {say:['hana','Teda mení režim odtoku. A zachytáva aj splaveniny – rieka pod hrádzou preto viac eroduje dno.']},
  {cam:[430,500,600],cd:3000,say:['lucia','Slanický ostrov. Pri napúšťaní nádrže zatopili niekoľko obcí – nad hladinou zostal len kopec s kostolom.']},

    <text x="10" y="${Math.min(yc-10,wt(10)+16)}" font-size="12" fill="var(--ink)" font-family="var(--f-mono)">hladina podzemnej vody</text>`;

    const okDry=wells.some(v=>{const b=Math.min(sy(v.x)+v.d*10,yc+14);return b>0.35*sy(v.x)+0.65*W[0][1]});

  }
  g.addEventListener('click',e=>{if(wells.length>=4)return;const p=g.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(g.getScreenCTM().inverse());const x=Math.max(14,Math.min(626,q.x));wells.push({x,d:+dep.value});draw()});

      $('#amsg',el).innerHTML='<div class="msg ok">Voda vystrekuje bez čerpadla. Tlak vody v kolektore zodpovedá výške oblasti doplňovania – piezometrická hladina je nad povrchom, preto je vrt samovýtokový (artézska studňa).</div>'}}
